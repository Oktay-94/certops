id: card-049
template: kette
title: "Battle Card 49 · CloudTrail-Forensik mit Athena"
subtitle: >-
  Ein Vorfall vier Monate in der Vergangenheit — beantwortbar nur, wenn vorher
  ein Trail nach S3 lief und die Abfrage auf Partitionsspalten filtert

frames:
  - key: cloud
    label: "AWS Cloud"
    icon: grp-cloud
    color: cloud
    full_height: true
  - key: region
    label: "Log-Archive-Account · Region eu-central-1 (Frankfurt)"
    icon: grp-region
    color: region
    full_height: true

outside:
  icon: users
  w: 170
  title: Forensik-Team
  subs: ["fragt nach einer", "Löschung von damals"]

chain:
  - icon: cloudtrail
    title: AWS CloudTrail
    subs: ["Organization Trail über", "alle 30 Accounts"]
    w: 240
    in: [cloud, region]
  - icon: s3
    title: Amazon S3
    subs: ["Prefix nach Account,", "Region und Tag"]
    w: 240
    in: [cloud, region]
  - icon: athena
    title: Amazon Athena
    subs: ["Partition Projection,", "kein Glue-Crawler nötig"]
    w: 240
    in: [cloud, region]
    hero: true
  - icon: documents
    title: SQL-Antwort
    subs: ["Principal, IP-Adresse,", "Zeitpunkt und Session"]
    w: 240
    in: [cloud, region]

branch:
  from: 2
  items:
    - icon: cloudtrail
      title: CloudTrail Insights
      subs: ["Baseline aus 28 Tagen,", "Data Events seit 11/2025"]
      w: 240
      align_with: 2

crossband:
  heading: "Die Kostenfalle, eine Verfügbarkeitsnotiz — und der Weg, der zu kurz greift"
  items:
    - icon: cost-explorer
      title: Abrechnung nach gescannten Bytes
      subs: ["Datumsfilter gehören auf die Partitionsspalten", "ein Filter auf eventTime reduziert nichts"]
    - icon: cloudtrail
      title: CloudTrail Lake
      subs: ["nimmt seit dem 31.05.2026 keine neuen", "Kunden mehr an — keine Option für Neubauten"]
    - icon: cloudtrail
      title: Event History
      subs: ["verworfen: 90 Tage, nur Management Events", "und für Athena nicht abfragbar"]

legend_cols: 2
legend:
  - "1  Das Forensik-Team fragt nach einer Löschung von vor vier Monaten"
  - "2  Der Organization Trail schreibt die Events aller Accounts weg"
  - "3  Athena liest sie dort und berechnet die Partitionen selbst"
  - "4  Die Antwort nennt Principal, IP-Adresse, Zeitpunkt und Session"
  - "5  Parallel dazu hätte Insights die Anomalie schon vorher gemeldet"
  - "Ohne Trail nach S3 gibt es nichts zu untersuchen — Event History ist kein Trail"
  - "Wer nach einem gelöschten Objekt sucht, braucht Data Events"
