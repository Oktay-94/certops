id: card-029
template: kette
title: "Szenario 29 · MongoDB-Workload managed betreiben, ohne umzuschreiben"
subtitle: >-
  1,4 TB Katalogdaten aus einem selbst betriebenen Replica Set — das Datenmodell
  bleibt, der Betrieb wandert, die Anwendung wird nicht angefasst

frames:
  - key: cloud
    label: AWS Cloud
    icon: grp-cloud
    color: cloud
    full_height: true
  - key: region
    label: "Region eu-central-1 (Frankfurt)"
    icon: grp-region
    color: region
    full_height: true
  - key: vpc
    label: VPC
    icon: grp-vpc
    color: vpc
  - key: subnet
    label: Privates Subnetz
    icon: grp-private-subnet
    color: subnet-private

outside:
  icon: servers
  title: MongoDB Replica Set
  title_lines: ["MongoDB", "Replica Set"]
  subs: ["eigenes Rechenzentrum,", "drei Knoten, 1,4 TB"]
  w: 175

chain:
  - icon: a-w-s-database-migration-service
    title: AWS DMS
    subs: ["Full Load plus CDC,", "homogen, ohne SCT"]
    w: 200
    in: [cloud, region]

  - icon: amazon-document-d-b
    title: Amazon DocumentDB
    subs: ["Primary-Instanz, spricht MongoDB", "Compute und Storage getrennt"]
    hero: true
    w: 245
    in: [cloud, region, vpc, subnet]

  - icon: databases
    title: Cluster-Volume
    subs: ["6 Kopien über 3 AZs,", "wächst bis 128 TiB"]
    w: 215
    in: [cloud, region, vpc, subnet]

  - icon: amazon-document-d-b
    title: Read Replicas
    subs: ["bis zu 15, ohne eigene", "Kopie der Daten"]
    w: 195
    in: [cloud, region, vpc, subnet]

  - icon: app
    title: Wildbach-Shop
    subs: ["MongoDB-Treiber bleibt,", "neuer Connection-String"]
    w: 175
    in: [cloud, region]

crossband:
  heading: "Querschnitt: Was im Kursmaterial zu DocumentDB meist fehlt"
  items:
    - icon: amazon-document-d-b-elastic-clusters
      title: Elastic Clusters
      subs: ["Sharding für Millionen", "Vorgänge pro Sekunde"]
    - icon: amazon-document-d-b
      title: DocumentDB Serverless
      title_lines: ["DocumentDB", "Serverless"]
      subs: ["feingranulare Skalierung,", "bis zu 90 % günstiger"]
    - icon: amazon-document-d-b
      title: Version 8.0
      subs: ["MongoDB-API 6.0, 7.0, 8.0,", "In-place-Upgrade ab 5.0"]
    - icon: alert
      title: Kompatibilitätsliste
      subs: ["implementiert die API,", "nicht die Engine"]

legend_cols: 3
legend:
  - "1  DMS liest aus dem bestehenden Replica Set im Rechenzentrum"
  - "2  Erst wandert der Bestand, dann hält CDC die Zielseite aktuell"
  - "3  Die Primary-Instanz schreibt in das gemeinsame Cluster-Volume"
  - "4  Die Replicas lesen aus demselben Volume, ohne eigene Kopie"
  - "5  Die Anwendung wechselt den Connection-String, sonst nichts"
  - "Dokument zu Dokument — für diese Migration braucht es kein SCT"
