id: card-066
template: kette
title: "Szenario 66 · Absatzprognose für Filial-Nachschub"
subtitle: >-
  Forecast wäre der passende Dienst und ist für Neukunden zu — SageMaker Canvas
  verlangt dafür ein Dataset statt drei und wird direkt als Endpoint aufgerufen

frames:
  - key: cloud
    label: AWS Cloud
    icon: grp-cloud
    color: cloud
    full_height: true
  - key: region
    label: "Region eu-central-1 (Frankfurt)"
    icon: grp-region
    color: region
    full_height: true

outside:
  icon: office
  title: Filialen
  subs: ["180 Filialen liefern", "Kassendaten seit 2023"]

chain:
  - icon: s3
    title: Amazon S3
    subs: ["drei Jahre Historie,", "Aktionen, Stammdaten"]
    w: 178
    in: [cloud, region]

  - icon: amazon-sage-maker-a-i-canvas
    title: Canvas Data Flow
    title_lines: ["Canvas", "Data Flow"]
    subs: ["führt drei Dateien zu", "einem Dataset zusammen"]
    w: 178
    in: [cloud, region]
    note: {text: "ohne SageMaker Domain kein Canvas", bold: true}

  - icon: amazon-sage-maker-a-i
    title: Canvas AutoML
    subs: ["Ensemble mehrerer", "Algorithmen, Leaderboard"]
    w: 178
    in: [cloud, region]

  - icon: s3
    title: Amazon S3
    subs: ["Modelle und Datasets", "im Canvas-Bucket"]
    w: 178
    in: [cloud, region]

  - icon: amazon-sage-maker-a-i-model
    title: Real-time Endpoint
    title_lines: ["Real-time", "Endpoint"]
    subs: ["rechnet die Prognose", "bei jedem Aufruf"]
    w: 178
    in: [cloud, region]
    note: {text: "Endpoint direkt aufrufen"}

  - icon: app
    title: Warenwirtschaft
    subs: ["ruft die Prognose", "per HTTPS ab"]
    w: 178

branch:
  from: 0
  items:
    - icon: amazon-forecast
      title: Amazon Forecast
      subs: ["genau diese drei Datasets", "verworfen: Neukunden zu"]
      w: 210

legend_cols: 2
legend:
  - "1  Die Filialen liefern seit drei Jahren Kassendaten nach S3"
  - "2  Der Data Flow führt die drei Dateien zu einem Dataset zusammen"
  - "3  AutoML trainiert ein Ensemble und deployt das beste Modell"
  - "4  Modelle und Datasets liegen im konfigurierten Canvas-Bucket"
  - "5  Von dort wird das Modell auf den Real-time Endpoint gebracht"
  - "6  Die Warenwirtschaft ruft den Endpoint per HTTPS auf"
  - "7  Verworfen: Forecast ist seit dem 29.07.2024 für Neukunden zu"
  - "Der Migrationsaufwand liegt im Umbau der Daten, nicht im Modell"
  - "Wartungsmodus heißt nicht Abschaltung — ein Enddatum gibt es nicht"
