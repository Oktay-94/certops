id: card-005
template: kette
title: "Karte 5 · AWS App Runner und ECR"
subtitle: >-
  Image rein, HTTPS-URL raus: die höchste Abstraktionsebene für Container auf AWS —
  und der Hinweis, warum ein Neubau heute trotzdem woanders landet

frames:
  - key: cloud
    label: AWS Cloud
    icon: grp-cloud
    color: cloud
    full_height: true
  - key: region
    label: "Region eu-central-1 (Frankfurt)"
    icon: grp-region
    color: region
    full_height: true

outside:
  icon: user
  title: Kleines Team
  subs: ["schiebt das fertige", "Container-Image"]
  w: 170

chain:
  - icon: amazon-elastic-container-registry
    title: Amazon ECR
    subs: ["privates Image-Registry,", "Quelle des Service"]
    w: 200
    in: [cloud, region]

  - icon: a-w-s-app-runner
    title: AWS App Runner
    subs:
      - "Load Balancing, TLS, Scaling"
      - "und Deploys — alles intern"
      - ""
      - "Maintenance Mode: ab 30.04.2026"
      - "keine Neukunden mehr"
    hero: true
    w: 260
    in: [cloud, region]

  - icon: users
    title: Nutzer
    subs: ["erreichen den Dienst über", "die fertige HTTPS-URL"]
    w: 200
    in: []

branch:
  from: 1
  items:
    - icon: ecs
      title: Amazon ECS Express Mode
      title_lines: ["Amazon ECS", "Express Mode"]
      subs: ["Migrationspfad ab 2026,", "gleiche Einfachheit"]
      w: 200

legend_cols: 2
legend:
  - "1  Das Team schiebt das fertige Image nach ECR"
  - "2  App Runner baut daraus einen Service — ohne Cluster, ohne Task-Definition"
  - "3  Nutzer erreichen den Dienst über die fertige awsapprunner.com-URL"
  - "4  Bei einem Neubau heute führt der Weg zu ECS Express Mode"
  - "App Runner ist im Kern ein dünner Wrapper um ECS Fargate"
  - "Bestandskunden nutzen App Runner weiter, es kommen aber keine Features mehr"
