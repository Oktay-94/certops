id: card-034
template: vorher_nachher
title: "Karte 34 · NAT Gateway gegen VPC Endpoints"
subtitle: >-
  Ab wann sich ein Endpoint rechnet: Gateway Endpoint immer, Interface Endpoint
  erst ab rund 626 GB pro Monat und Dienst

base:
  region: "Region eu-central-1"
  vpc_label: "VPC"
  subnet_label: "Private Subnetze über drei Availability Zones"
  forward: "Antworten laufen denselben Weg zurück ins Subnetz"
  left:
    icon: nat-gateway
    title: NAT Gateway
    subs: ["drei Stück, je 32,85 $/Monat", "plus 0,045 $ je GB"]
  inner:
    icon: ec2
    title: Amazon EC2
    subs: ["Datenplattform,", "verteilt über drei AZ"]

panels:
  - state: broken
    headline: "Vorher — jedes GB nimmt denselben Weg: 614 $ im Monat"
    back: "alle 11,4 TB durch den NAT — 614 $ im Monat"
    extras:
      - icon: router
        title: Route Table
        subs: ["0.0.0.0/0 zum NAT —", "auch S3, ECR und Logs"]
        accent: fail
        badge: true
    insert:
      kind: gap
      bold_lines: 2
      lines:
        - "Hier fehlt der"
        - "Gateway Endpoint"
        - "8 TB S3-Verkehr laufen durch"
        - "den NAT und werden abgerechnet"

  - state: fixed
    headline: "Nachher — S3 kostenlos, ECR über Endpoints, Logs bewusst am NAT: 199 $"
    back: "nur noch 300 GB echtes Internet — 199 $ im Monat"
    extras:
      - icon: router
        title: Route Table
        subs: ["S3-Prefix-List zeigt", "auf den Endpoint"]
        accent: ok
        badge: true
        w: 190
      - icon: amazon-v-p-c-elastic-network-interface
        title: Interface Endpoint
        subs: ["ecr.api und ecr.dkr", "69,40 $ statt 115,20 $"]
        accent: ok
        badge: true
        w: 175
    insert:
      kind: node
      icon: vpc-endpoint
      title: Gateway Endpoint
      subs: ["8 TB nach Amazon S3, kostenlos", "kein Gerät, ein Routeneintrag"]

legend_cols: 2
legend_heading: "Was in welchem Schritt passiert"
legend:
  - "1  Der NAT übersetzt in beide Richtungen — die Antwort kommt denselben Weg zurück"
  - "2  11,4 TB durch den NAT: 8 TB S3, 2,5 TB ECR, 400 GB Logs, 300 GB Internet — 614 $"
  - "3  Die Route Table schickt 0.0.0.0/0 zum NAT, auch den Verkehr zu AWS-Diensten"
  - "4  Am Antwortweg ändert sich nichts: der NAT bleibt für echten Internetverkehr"
  - "5  Nur 300 GB echtes Internet bleiben am NAT — aus 614 $ werden 199 $ im Monat"
  - "6  Die S3-Prefix-List in der Route Table zeigt auf den Endpoint, kostenlos und ohne Gerät"
  - "7  ecr.api und ecr.dkr über drei AZ kosten 69,40 $ statt 115,20 $ über den NAT"
  - "CloudWatch Logs bleibt bewusst am NAT: 18 $ gegen 25,90 $ über einen eigenen Endpoint"
