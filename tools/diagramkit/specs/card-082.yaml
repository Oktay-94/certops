id: card-082
template: fanout
title: "Szenario 82 · AWS Backup zentral über Accounts"
subtitle: >-
  Eine Backup Policy für 40 Konten, der Recovery Point entsteht immer zuerst
  im Quell-Account — erst die Copy Action bringt ihn in den zentralen Vault
lane_note: "drei von 40 Workload-Accounts — jeder erbt dieselbe Policy"
region: "Region eu-central-1 · Kopie geht in eine zweite Region"

outside:
  icon: documents
  title: Aufsicht
  subs: ["verlangt sieben Jahre", "unveränderlich"]

producer:
  icon: a-w-s-organizations
  title: AWS Organizations
  subs: ["Backup Policy einmal", "zentral definiert"]

store:
  icon: a-w-s-organizations-account
  title: Delegierter Account
  subs: ["verwaltet die Policies", "statt Management-Account"]

hub:
  icon: backup
  title: AWS Backup
  subs: ["Backup Plan: Zeitplan", "und Lifecycle je Regel", "", "gilt in jedem Konto gleich"]

aside:
  icon: a-w-s-backup-vault-lock
  title: AWS Backup Vault Lock
  subs: ["schließt den zentralen", "Vault im Compliance Mode"]

lanes:
  - queue:
      icon: ebs
      title: Amazon EBS
      subs: ["Volumes des Kontos,", "per Tag ausgewählt"]
    worker:
      icon: a-w-s-backup-backup-vault
      title: Lokaler Vault
      subs: ["Recovery Point entsteht", "im Quell-Account"]
    target:
      icon: a-w-s-backup-backup-vault
      title: Zentraler Vault
      subs: ["Kopie im Backup-Account,", "zweite Region"]

  - queue:
      icon: rds
      title: Amazon RDS
      subs: ["Snapshots des Kontos,", "per Tag ausgewählt"]
    worker:
      icon: a-w-s-backup-backup-vault
      title: Lokaler Vault
      subs: ["Recovery Point entsteht", "im Quell-Account"]
    target:
      icon: a-w-s-backup-backup-vault
      title: Zentraler Vault
      subs: ["Kopie im Backup-Account,", "zweite Region"]

  - queue:
      icon: s3
      title: Amazon S3
      subs: ["Buckets des Kontos,", "per Tag ausgewählt"]
    worker:
      icon: a-w-s-backup-backup-vault
      title: Lokaler Vault
      subs: ["Recovery Point entsteht", "im Quell-Account"]
    target:
      icon: a-w-s-backup-backup-vault
      title: Zentraler Vault
      subs: ["Kopie im Backup-Account,", "zweite Region"]

callout:
  headline: Fallstrick
  lines:
    - "Im Governance Mode entfernt ihn jeder mit genug IAM-Rechten wieder."
    - "Gegen einen übernommenen Admin-Account schützt nur der"
    - "Compliance Mode — Grace Time ab drei Tagen, danach endgültig."

legend:
  - "1  Die Aufsicht verlangt sieben Jahre unveränderliche Aufbewahrung"
  - "2  Verwaltet wird aus dem delegierten Account, nicht aus dem Management-Account"
  - "3  Aus der vererbten Policy wird in jedem Konto ein Backup Plan"
  - "4  Der Plan sichert die EBS-Volumes des ersten Kontos"
  - "5  ebenso die Datenbanken des zweiten Kontos"
  - "6  und die Buckets des dritten Kontos"
  - "7  Der Recovery Point entsteht in jeder Bahn zuerst im eigenen Konto"
  - "8  Erst die Copy Action legt die Kopie in den zentralen Vault"
  - "Alle drei Bahnen kopieren in denselben Vault des Backup-Accounts"
  - "Ein Backup direkt in ein fremdes Konto schreiben geht nicht"
