id: card-002
template: kette
title: "Karte 2 · ECS auf Fargate, ALB und ECR"
subtitle: >-
  ShopFlow bringt fertige Docker-Container in Produktion: kein Cluster-Management,
  kein OS-Patching, keine EC2-Instanzen — ECS orchestriert, Fargate stellt die Compute-Ebene

frames:
  - key: cloud
    label: AWS Cloud
    icon: grp-cloud
    color: cloud
    full_height: true
  - key: region
    label: "Region eu-central-1 (Frankfurt)"
    icon: grp-region
    color: region
    full_height: true
  - key: vpc
    label: VPC
    icon: grp-vpc
    color: vpc

outside:
  icon: users
  title: Nutzer
  subs: ["rufen die Web-App", "über HTTPS auf"]
  w: 160

chain:
  - icon: alb
    title: Application Load Balancer
    title_lines: ["Application", "Load Balancer"]
    subs: ["öffentlicher Eintrittspunkt,", "terminiert TLS"]
    w: 200
    in: [cloud, region, vpc]

  - icon: ecs
    title: Amazon ECS
    subs: ["Tasks im Launch-Type Fargate", "", "AWS stellt Instanzen,", "AMIs und Patching"]
    hero: true
    w: 240
    in: [cloud, region, vpc]

  - icon: amazon-elastic-container-registry
    title: Amazon ECR
    subs: ["privates Image-Registry,", "Quelle der Task-Definition"]
    w: 210
    in: [cloud, region]

legend_cols: 2
legend:
  - "1  Der Nutzer erreicht die App über den Application Load Balancer"
  - "2  Der ALB verteilt auf die gesunden Tasks seiner Target Group"
  - "3  Jeder Task zieht sein Image beim Start aus ECR — ohne Image kein Task"
  - "Fargate ist kein eigener Dienst, sondern ein Launch-Type von ECS"
  - "Jeder Task bekommt eine eigene ENI: die Subnetz-Größe begrenzt die Task-Zahl"
