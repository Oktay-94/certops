id: card-019
template: vorher_nachher
title: "Szenario 19 · EBS gp3 und io2 Block Express — garantierte IOPS und schneller Restore"
subtitle: >-
  Derselbe Snapshot, zweimal wiederhergestellt: einmal ist die Datenbank verfügbar und trotzdem
  stundenlang zäh, einmal liefert sie ab der ersten Sekunde ihre provisionierte Leistung

base:
  region: "Region eu-central-1 (Frankfurt)"
  vpc_label: "VPC des Zahlungsdienstleisters"
  subnet_label: "Privates Subnetz · Ziel-AZ des Restores"
  forward: "im Störfall entsteht aus dem Snapshot ein neues Volume"
  left:
    icon: amazon-elastic-block-store-snapshot
    title: EBS Snapshots
    subs: ["täglich über den Data", "Lifecycle Manager, regional"]
  inner:
    icon: ec2
    title: Amazon EC2
    subs: ["PostgreSQL, 4 TiB OLTP,", "p99 unter 10 ms"]

panels:
  - state: broken
    headline: "Vorher — gp2 und ein Restore ohne Vorbereitung: verfügbar, aber nicht leistungsfähig"
    back: "die Blöcke kommen lazy nach — die Datenbank bleibt zäh"
    extras:
      - icon: amazon-elastic-block-store-volume
        title: gp2-Volume
        subs: ["3 IOPS je GiB, Spitzen", "aus dem Burst-Guthaben"]
        ssize: 10
        accent: fail
        badge: true
        w: 190
    insert:
      kind: gap
      bold_lines: 2
      lines:
        - "Hier fehlt"
        - "Fast Snapshot Restore"
        - "verfügbar ist nicht leistungsfähig"

  - state: fixed
    headline: "Nachher — io2 Block Express für die Primary, gp3 für die Replica, FSR für den Störfall"
    back: "volle provisionierte Leistung ab der ersten Sekunde"
    extras:
      - icon: amazon-elastic-block-store
        title: io2 Block Express
        subs: ["unter 500 µs, 99,999 %,", "bis 256.000 IOPS"]
        ssize: 10
        accent: ok
        badge: true
        w: 180
      - icon: amazon-elastic-block-store-volumegp3
        title: gp3 für die Replica
        title_lines: ["gp3 für die", "Reporting-Replica"]
        subs: ["3.000 IOPS inklusive,", "IOPS getrennt buchbar"]
        ssize: 10
        accent: ok
        badge: true
        w: 180
    insert:
      kind: node
      icon: amazon-elastic-block-store-volume
      title: Fast Snapshot Restore
      title_lines: ["Fast Snapshot", "Restore"]
      subs: ["je Snapshot und je AZ aktiviert", "Abrechnung je DSU-Stunde"]

legend_cols: 2
legend_heading: "Was in welchem Schritt passiert"
legend:
  - "1  Aus dem täglichen Snapshot entsteht im Störfall ein neues Volume in der Ziel-AZ"
  - "2  Die Datenbank ist nach zwei Minuten oben und danach eine Stunde zäh — das reißt das SLA"
  - "3  gp2 koppelt IOPS an die Größe; ist das Burst-Guthaben leer, bricht die Latenz ein"
  - "4  Derselbe Snapshot, derselbe Weg — nur vorher vorbereitet"
  - "5  Das Volume bringt sofort seine 22.000 IOPS, die Datenbank ist in 30 Minuten wieder da"
  - "6  Die Primary läuft auf io2 Block Express: konstante Latenz statt guter Durchschnittswerte"
  - "7  Die Reporting-Replica bleibt auf gp3 — größere Volumes bringen dort keine IOPS mehr"
  - "Snapshots liegen regional: ein Volume lebt in einer AZ, ein Snapshot passt in jede AZ der Region"
  - "Snapshot Archive ist die Aufbewahrungsstufe, kein Störfallwerkzeug: Restore dauert 24 bis 72 Stunden"
