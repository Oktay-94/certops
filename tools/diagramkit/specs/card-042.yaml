id: card-042
template: kette
title: "Battle Card 42 · Cognito User Pool und Identity Pool"
subtitle: >-
  Anmeldung per E-Mail oder Google, danach direkter Upload nach S3 — jeder Nutzer
  ausschließlich in seinen eigenen Ordner, durchgesetzt von IAM statt von der App

frames:
  - key: cloud
    label: "AWS Cloud"
    icon: grp-cloud
    color: cloud
    full_height: true
  - key: region
    label: "Region eu-central-1 (Frankfurt)"
    icon: grp-region
    color: region
    full_height: true

outside:
  icon: client
  w: 180
  title: Mobile App
  subs: ["Fitness-App auf", "200.000 Geräten"]

chain:
  - icon: cognito
    title: Cognito User Pool
    subs: ["Verzeichnis, Managed Login", "liefert ID- und Access-Token"]
    w: 220
    in: [cloud, region]
  - icon: cognito
    title: Cognito Identity Pool
    subs: ["GetId, dann", "GetCredentialsForIdentity"]
    w: 220
    in: [cloud, region]
    hero: true
  - icon: a-w-s-identity-access-management-a-w-s-s-t-s
    title: AWS STS
    subs: ["AssumeRoleWithWebIdentity", "Credentials gelten 1 Stunde"]
    w: 220
    in: [cloud, region]
  - icon: a-w-s-identity-access-management-permissions
    title: IAM Policy
    subs: ["authenticated Role mit", "Identity ID im Bucket-Pfad"]
    w: 220
    in: [cloud, region]
  - icon: s3
    title: Amazon S3
    subs: ["ein Ordner je Nutzer,", "von S3 durchgesetzt"]
    w: 220
    in: [cloud, region]

branch:
  from: 0
  items:
    - icon: internet
      title: Google als externer IdP
      title_lines: ["Google als", "externer IdP"]
      subs: ["föderiert in denselben", "User Pool, gleiches Token"]
      w: 220
      align_with: 0

crossband:
  heading: "Was die Karte mitbeantwortet — und was dadurch entfällt"
  items:
    - icon: a-w-s-identity-access-management-role
      title: unauthenticated Role
      subs: ["für Gäste ohne Anmeldung", "enger gefasst als die andere"]
    - icon: apigateway
      title: API Gateway davor
      subs: ["dann reicht das User-Pool-Token", "und der Identity Pool entfällt"]
    - icon: a-w-s-identity-access-management-long-term-security-credential
      title: Eingebetteter Access Key
      subs: ["verworfen: aus dem Binary", "auslesbar, für alle gleich"]

legend_cols: 2
legend:
  - "1  Der Nutzer meldet sich am User Pool an und bekommt Tokens"
  - "2  Die App reicht das ID-Token an den Identity Pool weiter"
  - "3  Der Identity Pool lässt sich bei STS Credentials ausstellen"
  - "4  Die Policy der authenticated Role schneidet den Zugriff zu"
  - "5  Der Upload trifft nur den Ordner des angemeldeten Nutzers"
  - "6  Der User Pool reicht die Anmeldung an Google weiter"
  - "Beide Anmeldewege enden im selben Pool und liefern dieselben Tokens"
  - "Die Identity ID stammt aus dem Identity Pool, nicht aus dem User Pool"
