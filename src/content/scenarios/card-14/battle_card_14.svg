<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2E6BE6"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0F7C8C"/>
    </marker>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7A3FE0"/>
    </marker>
    <marker id="arrN" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#232F3E"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 14 — FSx for Windows File Server · Active Directory</text>
  <text x="60" y="106" font-size="21" fill="#555555">Windows-Fileserver in die Cloud: SMB-Freigaben und NTFS-Rechte bleiben, das Patchen entfällt</text>

  <!-- ============ ON-PREMISE ============ -->

  <rect x="40" y="155" width="360" height="430" rx="10" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="220" y="181" font-size="18" font-weight="bold" fill="#888888" text-anchor="middle">ON-PREMISE (Werk Dortmund)</text>

  <rect x="60" y="205" width="320" height="150" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="220" y="241" font-size="20" font-weight="bold" fill="#1B3E86" text-anchor="middle">Windows-Clients</text>
  <text x="76" y="274" font-size="15" fill="#444444">450 Mitarbeiter, Laufwerk Z:</text>
  <text x="76" y="297" font-size="15" fill="#444444">\\fsx.bergmann.local\shares</text>
  <text x="76" y="320" font-size="15" fill="#444444">8 TB Abteilungs- und CAD-Shares</text>
  <text x="76" y="345" font-size="15" font-style="italic" fill="#666666">merken vom Umzug nichts</text>

  <rect x="60" y="395" width="320" height="160" rx="10" fill="#F5F0FE" stroke="#7A3FE0" stroke-width="2.5"/>
  <text x="220" y="431" font-size="20" font-weight="bold" fill="#5B2BAF" text-anchor="middle">Active Directory</text>
  <text x="76" y="464" font-size="15" fill="#444444">self-managed, bergmann.local</text>
  <text x="76" y="487" font-size="15" fill="#444444">Benutzer, Gruppen, NTFS-ACLs</text>
  <text x="76" y="510" font-size="15" fill="#444444">bleibt die Quelle der Wahrheit</text>
  <text x="76" y="537" font-size="15" font-style="italic" fill="#666666">wird NICHT migriert</text>

  <!-- ============ Anbindung ============ -->

  <rect x="460" y="225" width="200" height="120" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="560" y="261" font-size="20" font-weight="bold" fill="#0B5A66" text-anchor="middle">Direct Connect</text>
  <text x="476" y="293" font-size="15" fill="#444444">oder Site-to-Site VPN</text>
  <text x="476" y="316" font-size="15" fill="#444444">SMB über TCP 445</text>
  <text x="476" y="338" font-size="15" font-style="italic" fill="#666666">plus AD-Ports</text>

  <line x1="382" y1="285" x2="456" y2="285" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="419" y="262" font-size="15" fill="#1B3E86" text-anchor="middle">SMB</text>
  <circle cx="419" cy="285" r="15" fill="#2E6BE6"/>
  <text x="419" y="291" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <line x1="662" y1="300" x2="746" y2="300" stroke="#0F7C8C" stroke-width="3" marker-end="url(#arrT)"/>
  <circle cx="704" cy="300" r="15" fill="#0F7C8C"/>
  <text x="704" y="306" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <path d="M382,470 L560,470 L560,345 L746,345" fill="none" stroke="#7A3FE0" stroke-width="3" stroke-dasharray="9,6" marker-end="url(#arrP)"/>
  <text x="392" y="497" font-size="15" fill="#5B2BAF">Domain Join + Authentifizierung</text>
  <circle cx="700" cy="345" r="15" fill="#7A3FE0"/>
  <text x="700" y="351" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- ============ AWS VPC ============ -->

  <rect x="700" y="155" width="850" height="600" rx="10" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="1125" y="181" font-size="18" font-weight="bold" fill="#888888" text-anchor="middle">AWS VPC (eu-central-1)</text>

  <rect x="725" y="205" width="520" height="185" rx="10" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="985" y="230" font-size="18" font-weight="bold" fill="#888888" text-anchor="middle">Availability Zone a</text>

  <rect x="750" y="245" width="470" height="125" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="985" y="281" font-size="20" font-weight="bold" fill="#2E6318" text-anchor="middle">FSx for Windows — Preferred</text>
  <text x="766" y="313" font-size="15" fill="#444444">aktiver Dateiserver auf SSD, sub-ms Latenz</text>
  <text x="766" y="336" font-size="15" fill="#444444">SMB 2.0–3.1.1 · NTFS-ACLs · DFS Namespaces</text>
  <text x="766" y="360" font-size="15" font-style="italic" fill="#666666">echter Windows Server — von AWS gepatcht</text>

  <rect x="725" y="415" width="520" height="185" rx="10" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="985" y="440" font-size="18" font-weight="bold" fill="#888888" text-anchor="middle">Availability Zone b</text>

  <rect x="750" y="455" width="470" height="125" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="985" y="491" font-size="20" font-weight="bold" fill="#2E6318" text-anchor="middle">FSx for Windows — Standby</text>
  <text x="766" y="523" font-size="15" fill="#444444">wartet passiv, übernimmt bei Ausfall</text>
  <text x="766" y="546" font-size="15" fill="#444444">und bei Wartungsarbeiten</text>
  <text x="766" y="570" font-size="15" font-style="italic" fill="#666666">nur im Multi-AZ-Deployment vorhanden</text>

  <path d="M1100,372 L1100,451" fill="none" stroke="#3F8624" stroke-width="3" stroke-dasharray="9,6" marker-end="url(#arrT)"/>
  <text x="1078" y="407" font-size="15" fill="#2E6318" text-anchor="end">synchron repliziert</text>
  <circle cx="1100" cy="402" r="15" fill="#3F8624"/>
  <text x="1100" y="408" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <rect x="1270" y="205" width="255" height="185" rx="10" fill="#F5F0FE" stroke="#7A3FE0" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="1397" y="241" font-size="19" font-weight="bold" fill="#5B2BAF" text-anchor="middle">Alternative</text>
  <text x="1286" y="273" font-size="15" fill="#444444">AWS Managed</text>
  <text x="1286" y="296" font-size="15" fill="#444444">Microsoft AD im VPC</text>
  <text x="1286" y="319" font-size="15" fill="#444444">statt self-managed AD</text>
  <text x="1286" y="346" font-size="15" font-style="italic" fill="#666666">oder Trust zwischen</text>
  <text x="1286" y="366" font-size="15" font-style="italic" fill="#666666">beiden Domänen</text>

  <rect x="1270" y="415" width="255" height="185" rx="10" fill="#EDF0F4" stroke="#232F3E" stroke-width="2.5"/>
  <text x="1397" y="451" font-size="19" font-weight="bold" fill="#232F3E" text-anchor="middle">Schutz &amp; Betrieb</text>
  <text x="1286" y="483" font-size="15" fill="#444444">Shadow Copies: Nutzer</text>
  <text x="1286" y="506" font-size="15" fill="#444444">holt Vorversion selbst</text>
  <text x="1286" y="529" font-size="15" fill="#444444">tägliche Backups</text>
  <text x="1286" y="556" font-size="15" font-style="italic" fill="#666666">Patching läuft im</text>
  <text x="1286" y="576" font-size="15" font-style="italic" fill="#666666">Wartungsfenster</text>

  <rect x="725" y="635" width="800" height="105" rx="10" fill="#EDF0F4" stroke="#232F3E" stroke-width="2.5"/>
  <text x="1125" y="671" font-size="20" font-weight="bold" fill="#232F3E" text-anchor="middle">Ein DNS-Name, ein UNC-Pfad — über den Failover hinweg</text>
  <text x="741" y="702" font-size="15" fill="#444444">Der Failover tauscht den Dateiserver, nicht den Namen. Windows-Clients verbinden sich selbst neu.</text>
  <text x="741" y="726" font-size="15" font-style="italic" fill="#666666">Linux- und macOS-SMB-Clients tun das nicht automatisch — sie hängen bis zum Failback.</text>

  <!-- ============ Footer ============ -->

  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  FSx for Windows = SMB + NTFS + AD · EFS = NFS + POSIX · Multi-AZ = Preferred + Standby unter einem Namen · AD wird nicht migriert</text>
</svg>
