<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2E6BE6"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0F7C8C"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 13 — Amazon EFS · EC2 Multi-AZ</text>
  <text x="60" y="106" font-size="21" fill="#555555">Mehrere Webserver in drei AZs brauchen dieselben Dateien — ein gemeinsames NFS-Dateisystem statt Kopien</text>

  <!-- ============ Zonen ============ -->

  <rect x="310" y="155" width="590" height="180" rx="10" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="605" y="181" font-size="18" font-weight="bold" fill="#888888" text-anchor="middle">Availability Zone eu-central-1a</text>

  <rect x="310" y="365" width="590" height="180" rx="10" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="605" y="391" font-size="18" font-weight="bold" fill="#888888" text-anchor="middle">Availability Zone eu-central-1b</text>

  <rect x="310" y="575" width="590" height="180" rx="10" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="605" y="601" font-size="18" font-weight="bold" fill="#888888" text-anchor="middle">Availability Zone eu-central-1c</text>

  <!-- ============ EC2 je Zone ============ -->

  <rect x="350" y="203" width="225" height="112" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="462" y="238" font-size="20" font-weight="bold" fill="#1B3E86" text-anchor="middle">EC2 Webserver</text>
  <text x="366" y="268" font-size="15" fill="#444444">CMS mountet</text>
  <text x="366" y="289" font-size="15" fill="#444444">/var/www/media</text>
  <text x="366" y="309" font-size="15" font-style="italic" fill="#666666">kein lokaler Zustand</text>

  <rect x="350" y="413" width="225" height="112" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="462" y="448" font-size="20" font-weight="bold" fill="#1B3E86" text-anchor="middle">EC2 Webserver</text>
  <text x="366" y="478" font-size="15" fill="#444444">Redakteurin lädt</text>
  <text x="366" y="499" font-size="15" fill="#444444">ein Bild hoch</text>
  <text x="366" y="519" font-size="15" font-style="italic" fill="#666666">schreibt in den Mount</text>

  <rect x="350" y="623" width="225" height="112" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="462" y="658" font-size="20" font-weight="bold" fill="#1B3E86" text-anchor="middle">EC2 Webserver</text>
  <text x="366" y="688" font-size="15" fill="#444444">neu skalierte</text>
  <text x="366" y="709" font-size="15" fill="#444444">Instanz</text>
  <text x="366" y="729" font-size="15" font-style="italic" fill="#666666">sofort vollständig</text>

  <!-- ============ Mount Targets ============ -->

  <rect x="625" y="203" width="255" height="112" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="752" y="238" font-size="20" font-weight="bold" fill="#0B5A66" text-anchor="middle">Mount Target</text>
  <text x="641" y="268" font-size="15" fill="#444444">ENI mit IP in dieser AZ</text>
  <text x="641" y="289" font-size="15" fill="#444444">Security Group: TCP 2049</text>
  <text x="641" y="309" font-size="15" font-style="italic" fill="#666666">genau einer pro AZ</text>

  <rect x="625" y="413" width="255" height="112" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="752" y="448" font-size="20" font-weight="bold" fill="#0B5A66" text-anchor="middle">Mount Target</text>
  <text x="641" y="478" font-size="15" fill="#444444">ENI mit IP in dieser AZ</text>
  <text x="641" y="499" font-size="15" fill="#444444">Security Group: TCP 2049</text>
  <text x="641" y="519" font-size="15" font-style="italic" fill="#666666">genau einer pro AZ</text>

  <rect x="625" y="623" width="255" height="112" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="752" y="658" font-size="20" font-weight="bold" fill="#0B5A66" text-anchor="middle">Mount Target</text>
  <text x="641" y="688" font-size="15" fill="#444444">ENI mit IP in dieser AZ</text>
  <text x="641" y="709" font-size="15" fill="#444444">Security Group: TCP 2049</text>
  <text x="641" y="729" font-size="15" font-style="italic" fill="#666666">genau einer pro AZ</text>

  <!-- ============ ALB ============ -->

  <rect x="40" y="380" width="230" height="150" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="155" y="416" font-size="19" font-weight="bold" fill="#1B3E86" text-anchor="middle">ALB + Auto Scaling</text>
  <text x="56" y="448" font-size="15" fill="#444444">Leser und Redaktion</text>
  <text x="56" y="469" font-size="15" fill="#444444">der Nordpresse</text>
  <text x="56" y="490" font-size="15" fill="#444444">3–12 Instanzen</text>
  <text x="56" y="516" font-size="15" font-style="italic" fill="#666666">Instanzen kommen/gehen</text>

  <path d="M272,440 L300,440 L300,259 L341,259" fill="none" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <path d="M272,469 L341,469" fill="none" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <path d="M272,498 L300,498 L300,679 L341,679" fill="none" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="155" y="366" font-size="15" fill="#1B3E86" text-anchor="middle">verteilt auf alle drei AZs</text>
  <circle cx="322" cy="469" r="15" fill="#2E6BE6"/>
  <text x="322" y="475" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- ============ Mount ============ -->

  <line x1="577" y1="259" x2="621" y2="259" stroke="#0F7C8C" stroke-width="3" marker-end="url(#arrT)"/>
  <line x1="577" y1="469" x2="621" y2="469" stroke="#0F7C8C" stroke-width="3" marker-end="url(#arrT)"/>
  <line x1="577" y1="679" x2="621" y2="679" stroke="#0F7C8C" stroke-width="3" marker-end="url(#arrT)"/>
  <text x="600" y="440" font-size="15" fill="#0B5A66" text-anchor="middle">mount</text>
  <circle cx="600" cy="469" r="15" fill="#0F7C8C"/>
  <text x="600" y="475" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- ============ NFS zum Dateisystem ============ -->

  <line x1="882" y1="469" x2="1006" y2="469" stroke="#0F7C8C" stroke-width="3" marker-end="url(#arrT)"/>
  <text x="944" y="440" font-size="15" fill="#0B5A66" text-anchor="middle">Write (NFS)</text>
  <circle cx="944" cy="469" r="15" fill="#0F7C8C"/>
  <text x="944" y="475" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <line x1="1006" y1="259" x2="886" y2="259" stroke="#0F7C8C" stroke-width="3" stroke-dasharray="9,6" marker-end="url(#arrT)"/>
  <text x="946" y="230" font-size="15" fill="#0B5A66" text-anchor="middle">Read (NFS)</text>
  <circle cx="946" cy="259" r="15" fill="#0F7C8C"/>
  <text x="946" y="265" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <line x1="1006" y1="679" x2="886" y2="679" stroke="#0F7C8C" stroke-width="3" stroke-dasharray="9,6" marker-end="url(#arrT)"/>
  <text x="946" y="650" font-size="15" fill="#0B5A66" text-anchor="middle">Read (NFS)</text>

  <!-- ============ EFS ============ -->

  <rect x="1010" y="155" width="525" height="600" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="1272" y="200" font-size="24" font-weight="bold" fill="#2E6318" text-anchor="middle">Amazon EFS (Regional)</text>
  <text x="1026" y="240" font-size="16" fill="#444444">Ein Dateisystem für alle Instanzen gleichzeitig</text>
  <text x="1026" y="266" font-size="16" fill="#444444">NFS v4.1 · POSIX-Rechte · File Locking</text>
  <text x="1026" y="292" font-size="16" fill="#444444">Daten liegen redundant in mehreren AZs</text>
  <text x="1026" y="318" font-size="16" fill="#444444">Kapazität wächst und schrumpft automatisch —</text>
  <text x="1026" y="344" font-size="16" fill="#444444">keine Provisionierung, kein Volume-Layout</text>
  <text x="1026" y="370" font-size="16" fill="#444444">Elastic Throughput (Default) skaliert mit der Last</text>
  <text x="1026" y="404" font-size="16" font-weight="bold" fill="#2E6318">Schreiben in AZ b ist in a und c sofort sichtbar</text>
  <text x="1026" y="430" font-size="15" font-style="italic" fill="#666666">close-to-open-Konsistenz, wie bei NFS üblich</text>

  <rect x="1032" y="470" width="481" height="265" rx="10" fill="#FBF5E6" stroke="#A16E00" stroke-width="2.5"/>
  <text x="1272" y="506" font-size="20" font-weight="bold" fill="#7A5300" text-anchor="middle">Lifecycle Management</text>
  <text x="1048" y="540" font-size="15" fill="#444444">EFS Standard (SSD, sub-ms) = heiße Dateien</text>
  <text x="1048" y="563" font-size="15" fill="#444444">→ EFS IA nach 30 Tagen ohne Zugriff</text>
  <text x="1048" y="586" font-size="15" fill="#444444">→ EFS Archive nach 90 Tagen ohne Zugriff</text>
  <text x="1048" y="609" font-size="15" fill="#444444">EFS Intelligent-Tiering holt bei Zugriff zurück</text>
  <text x="1048" y="641" font-size="15" font-style="italic" fill="#666666">IA und Archive: Abrufgebühr pro GB</text>
  <text x="1048" y="664" font-size="15" font-style="italic" fill="#666666">Archive: 90 Tage Mindestdauer, IA: keine</text>
  <text x="1048" y="696" font-size="15" font-style="italic" fill="#666666">EFS Standard ist teuer pro GB — der Preis</text>
  <text x="1048" y="719" font-size="15" font-style="italic" fill="#666666">für geteilte POSIX-Semantik</text>

  <!-- ============ Abgrenzung ============ -->

  <rect x="40" y="570" width="245" height="185" rx="10" fill="#FDEEEE" stroke="#C7161D" stroke-width="2.5"/>
  <text x="162" y="605" font-size="20" font-weight="bold" fill="#9E1015" text-anchor="middle">Warum nicht EBS?</text>
  <text x="56" y="637" font-size="15" fill="#444444">EBS lebt in EINER AZ</text>
  <text x="56" y="659" font-size="15" fill="#444444">und an EINER Instanz</text>
  <text x="56" y="681" font-size="15" fill="#444444">Multi-Attach nur io1/io2,</text>
  <text x="56" y="703" font-size="15" fill="#444444">gleiche AZ, Cluster-FS</text>
  <text x="56" y="729" font-size="15" font-style="italic" fill="#666666">S3 ist Objektspeicher,</text>
  <text x="56" y="749" font-size="15" font-style="italic" fill="#666666">kein POSIX-Dateisystem</text>

  <!-- ============ Footer ============ -->

  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  EFS = geteiltes NFS über AZ-Grenzen · EBS = eine AZ, eine Instanz · ein Mount Target je AZ, Port 2049 · FSx for Windows = SMB</text>
</svg>
