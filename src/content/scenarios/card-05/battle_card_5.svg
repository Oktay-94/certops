<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#ED7100"/>
    </marker>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2E6BE6"/>
    </marker>
    <marker id="arrDb" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2E27AD"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 5 — AWS App Runner · ECR</text>
  <text x="60" y="106" font-size="21" fill="#555555">Kleines Team will Container-Webservice deployen — ohne je ALB / VPC / Scaling anzufassen</text>

  <!-- ECR -->
  <rect x="60" y="330" width="250" height="150" rx="10" fill="#EEEDFA" stroke="#2E27AD" stroke-width="2.5"/>
  <text x="185" y="370" font-size="22" font-weight="bold" fill="#232082" text-anchor="middle">Amazon ECR</text>
  <text x="185" y="402" font-size="15" fill="#444444" text-anchor="middle">fertiges Container-Image</text>
  <text x="185" y="428" font-size="15" fill="#444444" text-anchor="middle">(oder Quell-Repo)</text>
  <text x="185" y="460" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">docker push</text>

  <!-- App Runner (die Blackbox) -->
  <rect x="470" y="290" width="470" height="290" rx="12" fill="#FDF3E9" stroke="#ED7100" stroke-width="2.5"/>
  <text x="705" y="332" font-size="24" font-weight="bold" fill="#B25400" text-anchor="middle">AWS App Runner</text>
  <text x="705" y="362" font-size="16" fill="#444444" text-anchor="middle">1 Service aus dem Image — AWS erledigt intern alles:</text>

  <rect x="500" y="386" width="185" height="60" rx="8" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/>
  <text x="592" y="410" font-size="14" fill="#444444" text-anchor="middle">Load Balancing</text>
  <text x="592" y="430" font-size="14" fill="#444444" text-anchor="middle">+ HTTPS-Endpunkt</text>

  <rect x="705" y="386" width="205" height="60" rx="8" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/>
  <text x="807" y="410" font-size="14" fill="#444444" text-anchor="middle">Auto Scaling</text>
  <text x="807" y="430" font-size="14" fill="#444444" text-anchor="middle">(inkl. scale-to-zero)</text>

  <rect x="500" y="458" width="185" height="60" rx="8" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/>
  <text x="592" y="482" font-size="14" fill="#444444" text-anchor="middle">Deploy + CI/CD</text>
  <text x="592" y="502" font-size="14" fill="#444444" text-anchor="middle">(Auto-Redeploy)</text>

  <rect x="705" y="458" width="205" height="60" rx="8" fill="#FFFFFF" stroke="#ED7100" stroke-width="1.8"/>
  <text x="807" y="482" font-size="14" fill="#444444" text-anchor="middle">TLS-Zertifikat</text>
  <text x="807" y="502" font-size="14" fill="#444444" text-anchor="middle">+ CloudWatch-Logs</text>

  <text x="705" y="552" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">kein VPC · kein ALB · keine Task-Definition · kein Cluster</text>

  <!-- Nutzer -->
  <rect x="1100" y="330" width="240" height="150" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="1220" y="370" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">Nutzer</text>
  <text x="1220" y="402" font-size="15" fill="#444444" text-anchor="middle">erreichen den Dienst</text>
  <text x="1220" y="428" font-size="15" fill="#444444" text-anchor="middle">über fertige HTTPS-URL</text>
  <text x="1220" y="460" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">*.awsapprunner.com</text>

  <!-- Schritt 1: ECR -> App Runner -->
  <line x1="310" y1="405" x2="467" y2="405" stroke="#2E27AD" stroke-width="3" marker-end="url(#arrDb)"/>
  <circle cx="388" cy="405" r="15" fill="#2E27AD"/>
  <text x="388" y="411" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="388" y="378" font-size="15" fill="#232082" text-anchor="middle">Image ziehen</text>

  <!-- Schritt 2: App Runner -> Nutzer -->
  <line x1="940" y1="405" x2="1097" y2="405" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <circle cx="1018" cy="405" r="15" fill="#2E6BE6"/>
  <text x="1018" y="411" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="1018" y="378" font-size="15" fill="#1B3E86" text-anchor="middle">HTTPS-URL</text>

  <!-- Status-Warnbox (rot) -->
  <rect x="60" y="620" width="1490" height="150" rx="10" fill="#FDEEEE" stroke="#C7161D" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="80" y="655" font-size="18" font-weight="bold" fill="#9E1015">⚠ Aktueller Service-Status (Stand 2026) — wichtig fürs Verständnis, nicht als Prüfungszahl</text>
  <text x="80" y="686" font-size="16" fill="#444444">App Runner geht in <tspan font-weight="bold">Maintenance Mode</tspan>: ab <tspan font-weight="bold">30.04.2026 keine Neukunden</tspan> mehr, Bestandskunden nutzen weiter, aber <tspan font-weight="bold">keine neuen Features</tspan>.</text>
  <text x="80" y="714" font-size="16" fill="#444444">Offizieller Migrationspfad: <tspan font-weight="bold">Amazon ECS Express Mode</tspan> — gleiche Einfachheit, voller ECS-Funktionsumfang (App Runner war stets ein dünner Wrapper um ECS Fargate).</text>
  <text x="80" y="742" font-size="16" fill="#9E1015"><tspan font-weight="bold">Fürs Examen:</tspan> Das Konzept „Container &#8594; HTTPS ohne Infra-Arbeit" bleibt relevant; bei Neu-Design ist heute ECS Express Mode die aktuelle Antwort.</text>

  <!-- Footer -->
  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  App Runner = einfachster Weg: Image rein, HTTPS-URL raus · kein VPC/ALB/Scaling · Nachfolger für Neubau = ECS Express Mode</text>
</svg>
