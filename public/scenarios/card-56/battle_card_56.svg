<svg viewBox="0 0 1600 900" width="1600" height="900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 56 — QuickSight, Athena, RDS</text>
  <text x="60" y="106" font-size="21" fill="#555555">Self-Service-BI fuers Management und eingebettete Dashboards fuer 300 Haendler — jeder sieht nur seine Zeilen</text>

  <rect x="895" y="200" width="360" height="410" rx="10" fill="none" stroke="#888888" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="1075" y="224" font-size="18" font-weight="bold" fill="#888888" text-anchor="middle">AMAZON QUICK SUITE</text>
  <text x="1075" y="243" font-size="15" font-style="italic" fill="#888888" text-anchor="middle">seit 09.10.2025 — ehem. QuickSight</text>

  <path d="M 210,342 L 210,372" stroke="#7B5EA7" stroke-width="2.5" fill="none" marker-end="url(#aPurple)"/>
  <path d="M 360,431 L 415,431 L 415,276 L 470,276" stroke="#7B5EA7" stroke-width="2.5" fill="none" marker-end="url(#aPurple)"/>
  <path d="M 620,342 L 620,430" stroke="#1B7F5A" stroke-width="2.5" fill="none" marker-end="url(#aGreen)"/>
  <path d="M 360,626 L 620,626 L 620,605" stroke="#1B7F5A" stroke-width="2.5" fill="none" marker-end="url(#aGreen)"/>
  <path d="M 770,470 L 925,470" stroke="#C2410C" stroke-width="2.5" fill="none" marker-end="url(#aOrange)"/>
  <path d="M 770,520 L 925,520" stroke="#C2410C" stroke-width="2.5" fill="none" marker-end="url(#aOrange)"/>
  <path d="M 1225,309 L 1290,309" stroke="#B03060" stroke-width="2.5" fill="none" marker-end="url(#aPink)"/>
  <path d="M 1225,507 L 1290,507" stroke="#B03060" stroke-width="2.5" fill="none" marker-end="url(#aPink)"/>

  <defs>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7B5EA7"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B7F5A"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/>
    </marker>
    <marker id="aPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B03060"/>
    </marker>
  </defs>

  <rect x="60" y="210" width="300" height="132" rx="10" fill="#EEF6F1" stroke="#1B7F5A" stroke-width="2.5"/>
  <text x="75" y="240" font-size="20" font-weight="bold" fill="#1B7F5A">Amazon S3 (Data Lake)</text>
  <text x="75" y="268" font-size="15" fill="#444444">7 Jahre Verkaufshistorie</text>
  <text x="75" y="290" font-size="15" fill="#444444">Parquet, partitioniert</text>
  <text x="75" y="316" font-size="15" font-style="italic" fill="#666666">Ablage, keine Query-Engine</text>

  <rect x="60" y="372" width="300" height="118" rx="10" fill="#F3EFF9" stroke="#7B5EA7" stroke-width="2.5"/>
  <text x="75" y="402" font-size="20" font-weight="bold" fill="#7B5EA7">AWS Glue Data Catalog</text>
  <text x="75" y="430" font-size="15" fill="#444444">Tabellen + Partitionen</text>
  <text x="75" y="452" font-size="15" fill="#444444">Register, speichert nichts</text>
  <text x="75" y="476" font-size="15" font-style="italic" fill="#666666">Schema fuer Athena</text>

  <rect x="60" y="560" width="300" height="132" rx="10" fill="#EEF6F1" stroke="#1B7F5A" stroke-width="2.5"/>
  <text x="75" y="590" font-size="20" font-weight="bold" fill="#1B7F5A">Amazon RDS</text>
  <text x="75" y="618" font-size="15" fill="#444444">PostgreSQL, Auftraege</text>
  <text x="75" y="640" font-size="15" fill="#444444">operative Datenbank</text>
  <text x="75" y="666" font-size="15" font-style="italic" fill="#666666">OLTP, nicht fuer BI-Last</text>

  <rect x="470" y="210" width="300" height="132" rx="10" fill="#FDF0E9" stroke="#C2410C" stroke-width="2.5"/>
  <text x="485" y="240" font-size="20" font-weight="bold" fill="#C2410C">Amazon Athena</text>
  <text x="485" y="268" font-size="15" fill="#444444">SQL auf S3, serverlos</text>
  <text x="485" y="290" font-size="15" fill="#444444">zahlt gescanntes Volumen</text>
  <text x="485" y="316" font-size="15" font-style="italic" fill="#666666">rechnet — zeigt nicht an</text>

  <rect x="470" y="430" width="300" height="175" rx="10" fill="#FDF0E9" stroke="#C2410C" stroke-width="2.5"/>
  <text x="485" y="460" font-size="20" font-weight="bold" fill="#C2410C">SPICE (In-Memory)</text>
  <text x="485" y="488" font-size="15" fill="#444444">importiert beide Datasets</text>
  <text x="485" y="510" font-size="15" fill="#444444">Refresh nach naechtlichem ETL</text>
  <text x="485" y="532" font-size="15" fill="#444444">Klicks loesen keinen Scan aus</text>
  <text x="485" y="558" font-size="15" font-style="italic" fill="#666666">Alternative: Direct Query —</text>
  <text x="485" y="578" font-size="15" font-style="italic" fill="#666666">frisch, aber pro Klick teuer</text>

  <rect x="925" y="250" width="300" height="118" rx="10" fill="#FCEEF3" stroke="#B03060" stroke-width="2.5"/>
  <text x="940" y="280" font-size="20" font-weight="bold" fill="#B03060">Analyse / Dashboard</text>
  <text x="940" y="308" font-size="15" fill="#444444">Filter ohne IT-Ticket</text>
  <text x="940" y="330" font-size="15" fill="#444444">Author erstellt selbst</text>
  <text x="940" y="354" font-size="15" font-style="italic" fill="#666666">Self-Service-BI</text>

  <rect x="925" y="430" width="300" height="155" rx="10" fill="#FCEEF3" stroke="#B03060" stroke-width="2.5"/>
  <text x="940" y="460" font-size="20" font-weight="bold" fill="#B03060">Row-Level Security</text>
  <text x="940" y="488" font-size="15" fill="#444444">Tag-based Rules</text>
  <text x="940" y="510" font-size="15" fill="#444444">Session-Tag = Haendler-ID</text>
  <text x="940" y="532" font-size="15" fill="#444444">filtert im Dataset</text>
  <text x="940" y="558" font-size="15" font-style="italic" fill="#666666">nur Textfelder, kein int</text>

  <rect x="1290" y="250" width="250" height="118" rx="10" fill="#F5F5F5" stroke="#555555" stroke-width="2.5"/>
  <text x="1305" y="280" font-size="20" font-weight="bold" fill="#555555">Management</text>
  <text x="1305" y="308" font-size="15" fill="#444444">Author in Quick Suite</text>
  <text x="1305" y="330" font-size="15" fill="#444444">klickt den ganzen Tag</text>
  <text x="1305" y="354" font-size="15" font-style="italic" fill="#666666">AWS-Login vorhanden</text>

  <rect x="1290" y="430" width="250" height="155" rx="10" fill="#F5F5F5" stroke="#555555" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="1305" y="460" font-size="20" font-weight="bold" fill="#555555">Haendlerportal</text>
  <text x="1305" y="488" font-size="15" fill="#444444">300 Haendler</text>
  <text x="1305" y="510" font-size="15" fill="#444444">kein AWS-Login</text>
  <text x="1305" y="532" font-size="15" fill="#444444">eingebettetes Dashboard</text>
  <text x="1305" y="558" font-size="15" font-style="italic" fill="#666666">anonymous embedding</text>

  <text x="228" y="366" font-size="15" font-style="italic" fill="#666666">Crawler / DDL</text>
  <text x="430" y="200" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Schema</text>
  <text x="640" y="366" font-size="15" font-style="italic" fill="#666666">Dataset A</text>
  <text x="400" y="650" font-size="15" font-style="italic" fill="#666666">Dataset B</text>
  <text x="778" y="462" font-size="15" font-style="italic" fill="#666666">geladen</text>
  <text x="778" y="512" font-size="15" font-style="italic" fill="#666666">gefiltert</text>

  <circle cx="210" cy="357" r="15" fill="#7B5EA7"/>
  <text x="210" y="363" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="442.5" cy="276" r="15" fill="#7B5EA7"/>
  <text x="442.5" y="282" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="620" cy="386" r="15" fill="#1B7F5A"/>
  <text x="620" y="392" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="620" cy="615.5" r="15" fill="#1B7F5A"/>
  <text x="620" y="621.5" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="900" cy="470" r="15" fill="#C2410C"/>
  <text x="900" y="476" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <circle cx="900" cy="520" r="15" fill="#C2410C"/>
  <text x="900" y="526" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
  <circle cx="1257.5" cy="309" r="15" fill="#B03060"/>
  <text x="1257.5" y="315" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
  <circle cx="1257.5" cy="507" r="15" fill="#B03060"/>
  <text x="1257.5" y="513" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text>

  <rect x="60" y="740" width="1480" height="110" rx="10" fill="#F7F7F7" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="80" y="778" font-size="16" font-weight="bold" fill="#111111">SPICE trennt Klick von Abfrage — anonym eingebettet filtert nur Tag-based RLS, und nur auf Textfeldern.</text>
  <text x="80" y="808" font-size="15" fill="#444444">Athena rechnet, QuickSight zeigt. Direct Query heisst: jeder Klick loest einen neuen Scan aus und kostet.</text>
  <text x="80" y="834" font-size="15" fill="#444444">Bei anonymem Embedding gibt es keinen QuickSight-User — user-based RLS greift ins Leere, nur Session-Tags wirken.</text>
</svg>
