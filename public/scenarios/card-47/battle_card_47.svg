<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0F7C8C"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3F8624"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#D97706"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#C7161D"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 47 — Amazon Macie · Sensitive Data Discovery</text>
  <text x="60" y="106" font-size="21" fill="#555555">Versicherer, 1.400 Buckets: Vollscan kostet sechsstellig — erst breit sampeln, dann gezielt tief</text>

  <!-- S3 (Gruen) x 40..270, y 210..350 -->
  <rect x="40" y="210" width="230" height="140" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="155" y="252" font-size="21" font-weight="bold" fill="#2E6318" text-anchor="middle">S3-Bestand</text>
  <text x="155" y="284" font-size="15" fill="#444444" text-anchor="middle">1.400 Buckets</text>
  <text x="155" y="308" font-size="15" fill="#444444" text-anchor="middle">30 Accounts</text>
  <text x="155" y="334" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">Inhalt unbekannt</text>

  <!-- Bucket-Posture (Teal) x 350..640, y 175..300 -->
  <rect x="350" y="175" width="290" height="125" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="495" y="212" font-size="21" font-weight="bold" fill="#0B5A66" text-anchor="middle">Bucket-Posture</text>
  <text x="495" y="242" font-size="15" fill="#444444" text-anchor="middle">public · unverschlüsselt</text>
  <text x="495" y="264" font-size="15" fill="#444444" text-anchor="middle">extern geteilt</text>
  <text x="495" y="288" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">ohne Objektzugriff</text>

  <!-- Automated Discovery (Teal) x 350..640, y 360..500 -->
  <rect x="350" y="360" width="290" height="140" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="495" y="398" font-size="21" font-weight="bold" fill="#0B5A66" text-anchor="middle">Automated Discovery</text>
  <text x="495" y="428" font-size="15" fill="#444444" text-anchor="middle">Sampling statt Vollscan</text>
  <text x="495" y="452" font-size="15" fill="#444444" text-anchor="middle">Data Map + Sensitivity Score</text>
  <text x="495" y="482" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">Default an, startet in 48 h</text>

  <!-- Custom Data Identifier (Teal) x 720..1010, y 175..300 -->
  <rect x="720" y="175" width="290" height="125" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="865" y="212" font-size="21" font-weight="bold" fill="#0B5A66" text-anchor="middle">Custom Data Identifier</text>
  <text x="865" y="242" font-size="15" fill="#444444" text-anchor="middle">Regex VS-DE-########</text>
  <text x="865" y="264" font-size="15" fill="#444444" text-anchor="middle">Keyword + Proximity</text>
  <text x="865" y="288" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">Managed kennt das nicht</text>

  <!-- Allow List (Teal) x 720..1010, y 360..480 -->
  <rect x="720" y="360" width="290" height="120" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="865" y="400" font-size="21" font-weight="bold" fill="#0B5A66" text-anchor="middle">Allow List</text>
  <text x="865" y="432" font-size="15" fill="#444444" text-anchor="middle">Testdaten ignorieren</text>
  <text x="865" y="460" font-size="15" fill="#444444" text-anchor="middle">schlägt jeden Identifier</text>

  <!-- Targeted Job (Teal) x 1090..1400, y 175..320 -->
  <rect x="1090" y="175" width="310" height="145" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="1245" y="215" font-size="21" font-weight="bold" fill="#0B5A66" text-anchor="middle">Targeted Job</text>
  <text x="1245" y="247" font-size="15" fill="#444444" text-anchor="middle">nur hohe Scores</text>
  <text x="1245" y="271" font-size="15" fill="#444444" text-anchor="middle">dort vollständig</text>
  <text x="1245" y="300" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">das ist die Audit-Evidenz</text>

  <!-- EventBridge + Lambda (Orange) x 1090..1400, y 380..510 -->
  <rect x="1090" y="380" width="310" height="130" rx="10" fill="#FEF7EC" stroke="#D97706" stroke-width="2.5"/>
  <text x="1245" y="422" font-size="21" font-weight="bold" fill="#A85A05" text-anchor="middle">EventBridge + Lambda</text>
  <text x="1245" y="454" font-size="15" fill="#444444" text-anchor="middle">Public Bucket mit PII</text>
  <text x="1245" y="482" font-size="15" fill="#444444" text-anchor="middle">wird automatisch dicht</text>

  <!-- Verworfen: Vollscan (Rot) x 350..660, y 620..780 -->
  <rect x="350" y="620" width="310" height="160" rx="10" fill="#FDEEEE" stroke="#C7161D" stroke-width="2.5"/>
  <text x="505" y="662" font-size="21" font-weight="bold" fill="#9E1015" text-anchor="middle">Vollscan aller Buckets</text>
  <text x="505" y="694" font-size="15" fill="#444444" text-anchor="middle">Discovery Job über alles</text>
  <text x="505" y="722" font-size="15" fill="#444444" text-anchor="middle">Preis pro GB inspiziert</text>
  <text x="505" y="756" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">sechsstellig kalkuliert</text>

  <!-- ===== Pfeile ===== -->
  <!-- 1: S3 -> Posture -->
  <line x1="270" y1="240" x2="342" y2="240" stroke="#3F8624" stroke-width="3" marker-end="url(#arrG)"/>
  <circle cx="306" cy="240" r="15" fill="#3F8624"/>
  <text x="306" y="246" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="306" y="200" font-size="15" fill="#2E6318" text-anchor="middle">inventarisiert</text>

  <!-- 2: S3 -> Automated Discovery -->
  <line x1="270" y1="320" x2="342" y2="415" stroke="#3F8624" stroke-width="3" marker-end="url(#arrG)"/>
  <circle cx="306" cy="368" r="15" fill="#3F8624"/>
  <text x="306" y="374" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="180" y="430" font-size="15" fill="#2E6318" text-anchor="middle">Sampling</text>

  <!-- 3: Posture -> CDI -->
  <line x1="640" y1="238" x2="712" y2="238" stroke="#0F7C8C" stroke-width="3" marker-end="url(#arrT)"/>
  <circle cx="676" cy="238" r="15" fill="#0F7C8C"/>
  <text x="676" y="244" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="676" y="163" font-size="15" fill="#0B5A66" text-anchor="middle">verfeinert</text>

  <!-- 4: Automated Discovery -> Allow List -->
  <line x1="640" y1="420" x2="712" y2="420" stroke="#0F7C8C" stroke-width="3" marker-end="url(#arrT)"/>
  <circle cx="676" cy="420" r="15" fill="#0F7C8C"/>
  <text x="676" y="426" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="676" y="522" font-size="15" fill="#0B5A66" text-anchor="middle">Ausnahmen</text>

  <!-- 5: Allow List -> unten herum -> EventBridge (rechtwinkliger Pfad) -->
  <path d="M865,480 L865,545 L1245,545 L1245,518" fill="none" stroke="#0F7C8C" stroke-width="3" marker-end="url(#arrT)"/>
  <circle cx="1055" cy="545" r="15" fill="#0F7C8C"/>
  <text x="1055" y="551" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="1055" y="588" font-size="15" fill="#0B5A66" text-anchor="middle">Findings</text>

  <!-- 6: Targeted Job -> EventBridge -->
  <line x1="1245" y1="320" x2="1245" y2="372" stroke="#0F7C8C" stroke-width="3" stroke-dasharray="9,6" marker-end="url(#arrT)"/>
  <circle cx="1245" cy="346" r="15" fill="#0F7C8C"/>
  <text x="1245" y="352" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="1450" y="352" font-size="15" fill="#0B5A66" text-anchor="middle">hoher Score</text>

  <!-- Verworfener Pfad: Vollscan -> Automated Discovery, mit rotem X -->
  <line x1="505" y1="620" x2="505" y2="508" stroke="#C7161D" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrR)"/>
  <circle cx="505" cy="564" r="20" fill="#FFFFFF" stroke="#C7161D" stroke-width="3"/>
  <line x1="491" y1="550" x2="519" y2="578" stroke="#C7161D" stroke-width="4"/>
  <line x1="519" y1="550" x2="491" y2="578" stroke="#C7161D" stroke-width="4"/>
  <text x="650" y="558" font-size="15" fill="#9E1015" text-anchor="middle">Kosten</text>
  <text x="650" y="578" font-size="15" fill="#9E1015" text-anchor="middle">verworfen</text>

  <!-- Hinweis links unten -->
  <text x="160" y="660" font-size="15" fill="#0B5A66" text-anchor="middle">Findings enthalten</text>
  <text x="160" y="682" font-size="15" fill="#0B5A66" text-anchor="middle">nie die Daten selbst</text>

  <!-- Footer -->
  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  Automated = wo suchen · Targeted = was liegt dort · Allow List schlägt jeden Identifier · Findings enthalten nie die Daten selbst</text>
</svg>
