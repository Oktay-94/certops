<text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  Tape Gateway spricht iSCSI-VTL  ·  Der Pool beim Eject bestimmt die Archivklasse  ·  Volume Gateway ist Block, nicht Tape</text>
