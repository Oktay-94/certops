<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 79 — Storage Gateway: Tape &amp; Volume</text>
<text x="60" y="106" font-size="21" fill="#555555">Bandsicherung ohne Bandroboter — der Archiv-Pool entscheidet beim Eject</text>
<rect x="40" y="190" width="600" height="430" rx="12" fill="none" stroke="#BBBBBB" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="340.0" y="218" font-size="18" font-weight="bold" fill="#888888" text-anchor="middle">On-Premises</text>
<rect x="780" y="190" width="790" height="510" rx="12" fill="none" stroke="#BBBBBB" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="1175.0" y="218" font-size="18" font-weight="bold" fill="#888888" text-anchor="middle">AWS Region</text>
