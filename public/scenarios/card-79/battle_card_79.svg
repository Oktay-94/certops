<text x="340.0" y="275" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">Backup-Software</text>
<text x="340.0" y="301" font-size="15" fill="#444444" text-anchor="middle">NetBackup, Veeam, Commvault</text>
<text x="340.0" y="327" font-size="15" fill="#444444" text-anchor="middle">schreibt auf Tape wie bisher</text>
<rect x="80" y="440" width="520" height="130" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
<text x="340.0" y="475" font-size="22" font-weight="bold" fill="#0B5A66" text-anchor="middle">Tape Gateway</text>
<text x="340.0" y="501" font-size="15" fill="#444444" text-anchor="middle">iSCSI-VTL: Media Changer + Drives</text>
<text x="340.0" y="527" font-size="15" fill="#444444" text-anchor="middle">lokaler Cache + Upload Buffer</text>
<text x="340.0" y="553" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">die Backup-Software merkt nichts</text>
<rect x="830" y="440" width="350" height="130" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
<text x="1005.0" y="475" font-size="22" font-weight="bold" fill="#2E6318" text-anchor="middle">Virtual Tape Library</text>
<text x="1005.0" y="501" font-size="15" fill="#444444" text-anchor="middle">Tapes liegen in S3</text>
<text x="1005.0" y="527" font-size="15" fill="#444444" text-anchor="middle">komprimiert + verschlüsselt</text>
<rect x="1290" y="380" width="260" height="120" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
<text x="1420.0" y="415" font-size="22" font-weight="bold" fill="#2E6318" text-anchor="middle">Glacier FR</text>
<text x="1420.0" y="441" font-size="15" fill="#444444" text-anchor="middle">Flexible Retrieval</text>
<text x="1420.0" y="467" font-size="15" fill="#444444" text-anchor="middle">schneller abrufbar</text>
<rect x="1290" y="540" width="260" height="120" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
<text x="1420.0" y="575" font-size="22" font-weight="bold" fill="#2E6318" text-anchor="middle">Deep Archive</text>
<text x="1420.0" y="601" font-size="15" fill="#444444" text-anchor="middle">Langzeitaufbewahrung</text>
<text x="1420.0" y="627" font-size="15" fill="#444444" text-anchor="middle">langsamer, günstiger</text>
<rect x="80" y="665" width="680" height="130" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5" stroke-dasharray="7,5"/>
<text x="420.0" y="700" font-size="22" font-weight="bold" fill="#2E6318" text-anchor="middle">Volume Gateway — zum Abgrenzen</text>
<text x="420.0" y="726" font-size="15" fill="#444444" text-anchor="middle">Cached: bis 32 TiB je Volume, S3 ist primär</text>
<text x="420.0" y="752" font-size="15" fill="#444444" text-anchor="middle">Stored: bis 16 TiB je Volume, alles lokal</text>
<text x="420.0" y="778" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Block-Volumes über iSCSI, keine Tapes</text>
<rect x="830" y="230" width="420" height="130" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5" stroke-dasharray="7,5"/>
<text x="1040.0" y="265" font-size="22" font-weight="bold" fill="#2E6318" text-anchor="middle">S3 File Gateway</text>
<text x="1040.0" y="291" font-size="15" fill="#444444" text-anchor="middle">NFS- / SMB-Share als Ziel</text>
<text x="1040.0" y="317" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Backup-Jobs auf Disk-Targets umbauen</text>
