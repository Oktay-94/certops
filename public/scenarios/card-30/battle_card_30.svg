<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2E6BE6"/></marker>
    <marker id="arrGy" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9A9A9A"/></marker>
    <marker id="arrN" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#232F3E"/></marker>
    <marker id="arrGr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3F8624"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 30 &#8212; Verifizierbare &#196;nderungshistorie</text>
  <text x="60" y="106" font-size="21" fill="#555555">QLDB, Aurora PostgreSQL und S3 Object Lock &#8212; drei Antworten auf die Frage, was genau bewiesen werden soll</text>

  <!-- Anwendung -->
  <rect x="40" y="365" width="250" height="175" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="165" y="405" font-size="20" font-weight="bold" fill="#1B3E86" text-anchor="middle">Schadensakte</text>
  <text x="165" y="438" font-size="15" fill="#444444" text-anchor="middle">Versicherung</text>
  <text x="165" y="460" font-size="15" fill="#444444" text-anchor="middle">jede &#196;nderung</text>
  <text x="165" y="482" font-size="15" fill="#444444" text-anchor="middle">muss nachweisbar</text>
  <text x="165" y="512" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">10 Jahre Pr&#252;fpflicht</text>

  <!-- Lane A: QLDB -->
  <rect x="350" y="155" width="520" height="175" rx="10" fill="#F7F1F1" stroke="#9A9A9A" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="610" y="195" font-size="21" font-weight="bold" fill="#555555" text-anchor="middle">Amazon QLDB</text>
  <text x="610" y="230" font-size="16" fill="#444444" text-anchor="middle">Journal als Hash-Kette, Tabellen sind Sichten darauf</text>
  <text x="610" y="254" font-size="16" fill="#444444" text-anchor="middle">PartiQL, serverless, ACID</text>
  <text x="610" y="288" font-size="15" font-style="italic" fill="#9E1015" text-anchor="middle">Support endete am 31.07.2025 &#8212; Dienst abgeschaltet</text>
  <text x="610" y="312" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">bleibt die erwartete Pr&#252;fungsantwort</text>

  <rect x="960" y="155" width="590" height="175" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="1255" y="195" font-size="21" font-weight="bold" fill="#1B3E86" text-anchor="middle">Beweisbar</text>
  <text x="1255" y="230" font-size="16" fill="#444444" text-anchor="middle">Digest und Proof zeigen: nichts wurde ge&#228;ndert</text>
  <text x="1255" y="254" font-size="16" fill="#444444" text-anchor="middle">Signalwort: cryptographically verifiable</text>
  <text x="1255" y="288" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Vertrauen in den Betreiber nicht n&#246;tig</text>

  <!-- Lane B: Aurora PostgreSQL -->
  <rect x="350" y="365" width="520" height="175" rx="10" fill="#EDF0F4" stroke="#232F3E" stroke-width="2.5"/>
  <text x="610" y="405" font-size="21" font-weight="bold" fill="#232F3E" text-anchor="middle">Aurora PostgreSQL</text>
  <text x="610" y="440" font-size="16" fill="#444444" text-anchor="middle">AWS-Empfehlung f&#252;r die Migration</text>
  <text x="610" y="464" font-size="16" fill="#444444" text-anchor="middle">Audit-Log, dauerhafte Aufbewahrung, Extensions</text>
  <text x="610" y="498" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Historie als eigene Tabelle gef&#252;hrt</text>

  <rect x="960" y="365" width="590" height="175" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="1255" y="405" font-size="21" font-weight="bold" fill="#1B3E86" text-anchor="middle">Nur nachvollziehbar</text>
  <text x="1255" y="440" font-size="16" fill="#444444" text-anchor="middle">Wer schreiben darf, kann die Historie &#228;ndern</text>
  <text x="1255" y="464" font-size="16" fill="#444444" text-anchor="middle">Signalwort: audit trail, wer hat wann was</text>
  <text x="1255" y="498" font-size="15" font-style="italic" fill="#9E1015" text-anchor="middle">Die Migration verliert die Verifizierbarkeit</text>

  <!-- Lane C: S3 Object Lock -->
  <rect x="350" y="575" width="520" height="175" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="610" y="615" font-size="21" font-weight="bold" fill="#2E6318" text-anchor="middle">S3 Object Lock</text>
  <text x="610" y="650" font-size="16" fill="#444444" text-anchor="middle">WORM, Versioning ist Voraussetzung</text>
  <text x="610" y="674" font-size="16" fill="#444444" text-anchor="middle">Governance- und Compliance-Modus</text>
  <text x="610" y="708" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Karte 15 &#8212; hier nur zur Abgrenzung</text>

  <rect x="960" y="575" width="590" height="175" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="1255" y="615" font-size="21" font-weight="bold" fill="#1B3E86" text-anchor="middle">Unl&#246;schbar, nicht beweisend</text>
  <text x="1255" y="650" font-size="16" fill="#444444" text-anchor="middle">Objekt kann im Zeitraum nicht &#252;berschrieben werden</text>
  <text x="1255" y="674" font-size="16" fill="#444444" text-anchor="middle">Signalwort: WORM, retention, compliance mode</text>
  <text x="1255" y="708" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">sagt nichts &#252;ber die Reihenfolge der &#196;nderungen</text>

  <!-- 1 Anwendung -> QLDB -->
  <path d="M 290,420 L 318,420 L 318,242 L 346,242" fill="none" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <circle cx="318" cy="330" r="15" fill="#2E6BE6"/>
  <text x="318" y="336" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- 2 Anwendung -> Aurora -->
  <line x1="290" y1="452" x2="346" y2="452" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <circle cx="318" cy="452" r="15" fill="#2E6BE6"/>
  <text x="318" y="458" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- 3 Anwendung -> Object Lock -->
  <path d="M 290,490 L 318,490 L 318,662 L 346,662" fill="none" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <circle cx="318" cy="580" r="15" fill="#2E6BE6"/>
  <text x="318" y="586" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- Dienst -> Garantie -->
  <line x1="870" y1="242" x2="956" y2="242" stroke="#9A9A9A" stroke-width="3" marker-end="url(#arrGy)"/>
  <line x1="870" y1="452" x2="956" y2="452" stroke="#232F3E" stroke-width="3" marker-end="url(#arrN)"/>
  <line x1="870" y1="662" x2="956" y2="662" stroke="#3F8624" stroke-width="3" marker-end="url(#arrGr)"/>

  <text x="876" y="222" font-size="15" fill="#555555">garantiert</text>
  <text x="876" y="432" font-size="15" fill="#232F3E">garantiert</text>
  <text x="876" y="642" font-size="15" fill="#2E6318">garantiert</text>

  <text x="350" y="790" font-size="15" font-style="italic" fill="#666666">Die Frage lautet nie &#8222;welche Datenbank&#8220;, sondern: Was genau muss bewiesen werden &#8212; die Unver&#228;ndertheit, der Verlauf oder die Aufbewahrung?</text>

  <!-- Footer -->
  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merks&#228;tze:</tspan>  QLDB beweist, Aurora protokolliert, Object Lock bewahrt auf &#183; QLDB ist abgeschaltet, bleibt aber Pr&#252;fungsantwort</text>
</svg>
