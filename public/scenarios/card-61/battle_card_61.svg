<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrQ" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2E6BE6"/>
    </marker>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#D97706"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#A16E00"/>
    </marker>
    <marker id="arrX" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#C7161D"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 61 &#8212; Rekognition, Lambda, S3, A2I</text>
  <text x="60" y="106" font-size="21" fill="#555555">Marktplatz prüft Produktbilder automatisch &#8212; Grenzfälle an Menschen</text>

  <!-- Upload-Bucket (Quelle) -->
  <rect x="48" y="250" width="250" height="150" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="173" y="288" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">Upload-Bucket</text>
  <text x="173" y="318" font-size="15" fill="#444444" text-anchor="middle">S3 &#8212; privat</text>
  <text x="173" y="339" font-size="15" fill="#444444" text-anchor="middle">Händler-Bilder</text>
  <text x="173" y="360" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">kein Public Access</text>

  <!-- Lambda (Compute) -->
  <rect x="390" y="250" width="250" height="150" rx="10" fill="#FEF7EC" stroke="#D97706" stroke-width="2.5"/>
  <text x="515" y="288" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">Lambda</text>
  <text x="515" y="318" font-size="15" fill="#444444" text-anchor="middle">Orchestrierung</text>
  <text x="515" y="339" font-size="15" fill="#444444" text-anchor="middle">liest MinConfidence</text>
  <text x="515" y="360" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">async, 2 Retries</text>

  <!-- Rekognition (Compute) -->
  <rect x="732" y="250" width="272" height="150" rx="10" fill="#FEF7EC" stroke="#D97706" stroke-width="2.5"/>
  <text x="868" y="288" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">Rekognition</text>
  <text x="868" y="318" font-size="14" fill="#444444" text-anchor="middle">DetectModerationLabels</text>
  <text x="868" y="339" font-size="15" fill="#444444" text-anchor="middle">Label + Confidence</text>
  <text x="868" y="360" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">kein Training nötig</text>

  <!-- Public-Bucket (Storage) -->
  <rect x="1210" y="170" width="250" height="130" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="1335" y="208" font-size="22" font-weight="bold" fill="#2E6318" text-anchor="middle">Public-Bucket</text>
  <text x="1335" y="238" font-size="15" fill="#444444" text-anchor="middle">S3 &#8212; freigegeben</text>
  <text x="1335" y="259" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">getrennter Bucket</text>

  <!-- A2I Human Loop (Governance) -->
  <rect x="1210" y="390" width="250" height="150" rx="10" fill="#FBF5E6" stroke="#A16E00" stroke-width="2.5"/>
  <text x="1335" y="428" font-size="21" font-weight="bold" fill="#7A5300" text-anchor="middle">A2I Human Loop</text>
  <text x="1335" y="458" font-size="15" fill="#444444" text-anchor="middle">Mensch entscheidet</text>
  <text x="1335" y="479" font-size="15" fill="#444444" text-anchor="middle">Private Workforce</text>
  <text x="1335" y="500" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Graubereich</text>

  <!-- Verworfen: Batch Image Content Moderation (Compute-Rolle, Ablehnung via X) -->
  <rect x="732" y="580" width="272" height="140" rx="10" fill="#FEF7EC" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="868" y="618" font-size="21" font-weight="bold" fill="#A85A05" text-anchor="middle">Batch Image Moder.</text>
  <text x="868" y="648" font-size="14" fill="#444444" text-anchor="middle">StartMediaAnalysisJob</text>
  <text x="868" y="669" font-size="15" fill="#444444" text-anchor="middle">Neuaccounts ab</text>
  <text x="868" y="690" font-size="15" fill="#444444" text-anchor="middle">30.04.2026 gesperrt</text>

  <!-- Segmente -->
  <line x1="298" y1="325" x2="382" y2="325" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrQ)"/>
  <line x1="640" y1="325" x2="724" y2="325" stroke="#D97706" stroke-width="3" marker-end="url(#arrC)"/>
  <line x1="1004" y1="300" x2="1202" y2="235" stroke="#D97706" stroke-width="3" marker-end="url(#arrC)"/>
  <line x1="1004" y1="350" x2="1202" y2="445" stroke="#A16E00" stroke-width="3" marker-end="url(#arrG)"/>
  <line x1="1210" y1="500" x2="1010" y2="500" stroke="#A16E00" stroke-width="3" stroke-dasharray="8,6"/>
  <line x1="1010" y1="500" x2="1010" y2="406" stroke="#A16E00" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrG)"/>
  <line x1="868" y1="400" x2="868" y2="572" stroke="#C7161D" stroke-width="3" marker-end="url(#arrX)"/>

  <!-- Badges -->
  <circle cx="320" cy="325" r="15" fill="#2E6BE6"/>
  <text x="320" y="331" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="682" cy="325" r="15" fill="#D97706"/>
  <text x="682" y="331" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="1083.2" cy="274" r="15" fill="#D97706"/>
  <text x="1083.2" y="280" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="1083.2" cy="388" r="15" fill="#A16E00"/>
  <text x="1083.2" y="394" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="1130" cy="500" r="15" fill="#A16E00"/>
  <text x="1130" y="506" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>

  <!-- rotes X auf dem verworfenen Pfad -->
  <circle cx="868" cy="500" r="20" fill="#FFFFFF" stroke="#C7161D" stroke-width="3"/>
  <line x1="856" y1="488" x2="880" y2="512" stroke="#C7161D" stroke-width="4"/>
  <line x1="880" y1="488" x2="856" y2="512" stroke="#C7161D" stroke-width="4"/>

  <!-- freie Labels -->
  <text x="340" y="301" font-size="15" fill="#1B3E86" text-anchor="middle">S3 Event</text>
  <text x="682" y="301" font-size="15" fill="#A85A05" text-anchor="middle">Bild-Key</text>
  <text x="1063" y="224" font-size="15" fill="#A85A05" text-anchor="middle">Confidence hoch</text>
  <text x="1063" y="342" font-size="15" fill="#7A5300" text-anchor="middle">Graubereich</text>
  <text x="1130" y="476" font-size="15" fill="#7A5300" text-anchor="middle">Urteil zurück</text>
  <text x="900" y="546" font-size="15" fill="#9E1015">kein Batch-Job</text>

  <!-- Footer -->
  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  Ein Bild, ein Sync-Call  ·  Zwei Buckets, keine Rekursion  ·  Schwellwert trennt, A2I entscheidet den Rest</text>
</svg>
