<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2E6BE6"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#D97706"/>
    </marker>
    <marker id="arrN" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#232F3E"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 11 — S3 Lifecycle · S3 Glacier Deep Archive</text>
  <text x="60" y="106" font-size="21" fill="#555555">Rechnungsarchiv mit 10 Jahren Aufbewahrungspflicht: fast nie Zugriff, Kosten minimieren — ohne manuelle Verwaltung</text>

  <!-- ============ Kopfzeile: Quelle + Lifecycle-Regel ============ -->

  <rect x="40" y="140" width="300" height="125" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="190" y="175" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">ERP-System</text>
  <text x="56" y="205" font-size="15" fill="#444444">2 Mio. Rechnungs-PDFs pro Jahr</text>
  <text x="56" y="227" font-size="15" fill="#444444">≈ 1,5 TB/Jahr · je 400 KB – 2 MB</text>
  <text x="56" y="252" font-size="15" font-style="italic" fill="#666666">10 Jahre Aufbewahrung (GoBD)</text>

  <rect x="365" y="140" width="1105" height="125" rx="10" fill="#FEF7EC" stroke="#D97706" stroke-width="2.5"/>
  <text x="917" y="175" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">S3 Lifecycle-Regel — eine Konfiguration steuert den gesamten Lebenszyklus</text>
  <text x="381" y="207" font-size="16" fill="#444444">Filter: prefix invoices/ · ObjectSizeGreaterThan 131072 (128 KB) — seit 09/2024 Standardverhalten für Transitions</text>
  <text x="381" y="231" font-size="16" fill="#444444">Aktionen: Tag 30 → S3 Standard-IA · Tag 365 → S3 Glacier Deep Archive · Tag 4015 → Expiration</text>
  <text x="381" y="255" font-size="16" font-style="italic" fill="#666666">ergänzend: AbortIncompleteMultipartUpload (7 Tage) · NoncurrentVersionExpiration · kein Cronjob, kein Skript</text>

  <line x1="190" y1="267" x2="190" y2="316" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <circle cx="190" cy="291" r="15" fill="#2E6BE6"/>
  <text x="190" y="297" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="212" y="296" font-size="15" fill="#1B3E86">PUT (PDF)</text>

  <!-- ============ Zeitachse der Speicherklassen ============ -->

  <rect x="40" y="320" width="290" height="185" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="185" y="358" font-size="22" font-weight="bold" fill="#2E6318" text-anchor="middle">S3 Standard</text>
  <text x="56" y="396" font-size="15" fill="#444444">Tag 0–30: Versand, Mahnwesen,</text>
  <text x="56" y="419" font-size="15" fill="#444444">Kundenservice, Rückfragen</text>
  <text x="56" y="442" font-size="15" fill="#444444">Zugriff in Millisekunden</text>
  <text x="56" y="472" font-size="15" font-style="italic" fill="#666666">≈ 0,023 $/GB-Monat</text>
  <text x="56" y="494" font-size="15" font-style="italic" fill="#666666">keine Mindestdauer</text>

  <rect x="420" y="320" width="290" height="185" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="565" y="358" font-size="22" font-weight="bold" fill="#2E6318" text-anchor="middle">S3 Standard-IA</text>
  <text x="436" y="396" font-size="15" fill="#444444">Tag 30–365: nur noch</text>
  <text x="436" y="419" font-size="15" fill="#444444">vereinzelte Rückfragen</text>
  <text x="436" y="442" font-size="15" fill="#444444">Millisekunden + Abrufgebühr</text>
  <text x="436" y="472" font-size="15" font-style="italic" fill="#666666">≈ 0,0125 $/GB-Monat</text>
  <text x="436" y="494" font-size="15" font-style="italic" fill="#666666">Mindestdauer 30 Tage</text>

  <rect x="800" y="320" width="330" height="185" rx="10" fill="#EDF0F4" stroke="#232F3E" stroke-width="2.5"/>
  <text x="965" y="358" font-size="21" font-weight="bold" fill="#232F3E" text-anchor="middle">S3 Glacier Deep Archive</text>
  <text x="816" y="396" font-size="15" fill="#444444">Ab Tag 365: reine Aufbewahrung,</text>
  <text x="816" y="419" font-size="15" fill="#444444">im Normalbetrieb nie gelesen</text>
  <text x="816" y="442" font-size="15" fill="#444444">Restore: 12 h Std. · 48 h Bulk</text>
  <text x="816" y="472" font-size="15" font-style="italic" fill="#666666">≈ 0,00099 $/GB-Monat (≈ 1 $/TB)</text>
  <text x="816" y="494" font-size="15" font-style="italic" fill="#666666">Mindestdauer 180 Tage</text>

  <rect x="1220" y="320" width="250" height="185" rx="10" fill="#F7F1F1" stroke="#9A9A9A" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="1345" y="358" font-size="22" font-weight="bold" fill="#555555" text-anchor="middle">Expiration</text>
  <text x="1236" y="396" font-size="15" fill="#444444">Tag 4015: Lifecycle</text>
  <text x="1236" y="419" font-size="15" fill="#444444">löscht das Objekt</text>
  <text x="1236" y="442" font-size="15" fill="#444444">10 Jahre + Jahresende</text>
  <text x="1236" y="472" font-size="15" font-style="italic" fill="#666666">Löschen gehört zur</text>
  <text x="1236" y="494" font-size="15" font-style="italic" fill="#666666">Kostenrechnung dazu</text>

  <line x1="332" y1="412" x2="418" y2="412" stroke="#D97706" stroke-width="3" marker-end="url(#arrO)"/>
  <text x="375" y="386" font-size="15" fill="#A85A05" text-anchor="middle">Tag 30</text>
  <circle cx="375" cy="412" r="15" fill="#D97706"/>
  <text x="375" y="418" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <line x1="712" y1="412" x2="798" y2="412" stroke="#D97706" stroke-width="3" marker-end="url(#arrO)"/>
  <text x="755" y="386" font-size="15" fill="#A85A05" text-anchor="middle">Tag 365</text>
  <circle cx="755" cy="412" r="15" fill="#D97706"/>
  <text x="755" y="418" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <line x1="1132" y1="412" x2="1218" y2="412" stroke="#D97706" stroke-width="3" marker-end="url(#arrO)"/>
  <text x="1175" y="386" font-size="15" fill="#A85A05" text-anchor="middle">Tag 4015</text>
  <circle cx="1175" cy="412" r="15" fill="#D97706"/>
  <text x="1175" y="418" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- ============ Abrufpfad: Betriebsprüfung ============ -->

  <rect x="40" y="590" width="270" height="150" rx="10" fill="#EDF0F4" stroke="#232F3E" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="175" y="626" font-size="22" font-weight="bold" fill="#232F3E" text-anchor="middle">Betriebsprüfung</text>
  <text x="56" y="660" font-size="15" fill="#444444">Finanzamt fordert</text>
  <text x="56" y="683" font-size="15" fill="#444444">Belege aus 2019 an</text>
  <text x="56" y="713" font-size="15" font-style="italic" fill="#666666">Frist: mehrere Werktage</text>

  <rect x="400" y="590" width="310" height="150" rx="10" fill="#EDF0F4" stroke="#232F3E" stroke-width="2.5"/>
  <text x="555" y="626" font-size="22" font-weight="bold" fill="#232F3E" text-anchor="middle">RestoreObject</text>
  <text x="416" y="660" font-size="15" fill="#444444">S3 Batch Operations für</text>
  <text x="416" y="683" font-size="15" fill="#444444">Millionen Objekte auf einmal</text>
  <text x="416" y="708" font-size="15" font-style="italic" fill="#666666">Tier: Bulk 48 h · Standard 12 h</text>
  <text x="416" y="730" font-size="15" font-style="italic" fill="#666666">kein Expedited bei Deep Archive</text>

  <rect x="1130" y="590" width="340" height="150" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="1300" y="626" font-size="22" font-weight="bold" fill="#2E6318" text-anchor="middle">Temporäre Kopie</text>
  <text x="1146" y="660" font-size="15" fill="#444444">lesbar wie S3 Standard,</text>
  <text x="1146" y="683" font-size="15" fill="#444444">Gültigkeit: RestoreDays</text>
  <text x="1146" y="708" font-size="15" font-style="italic" fill="#666666">Original bleibt Deep Archive —</text>
  <text x="1146" y="730" font-size="15" font-style="italic" fill="#666666">die Storage Class ändert sich nicht</text>

  <line x1="312" y1="665" x2="396" y2="665" stroke="#232F3E" stroke-width="3" marker-end="url(#arrN)"/>
  <text x="354" y="578" font-size="15" fill="#232F3E" text-anchor="middle">fordert an</text>
  <circle cx="354" cy="665" r="15" fill="#232F3E"/>
  <text x="354" y="671" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>

  <path d="M712,645 L860,645 L860,509" fill="none" stroke="#232F3E" stroke-width="3" marker-end="url(#arrN)"/>
  <text x="876" y="600" font-size="15" fill="#232F3E">Restore-Auftrag</text>
  <circle cx="786" cy="645" r="15" fill="#232F3E"/>
  <text x="786" y="651" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>

  <path d="M1030,507 L1030,665 L1126,665" fill="none" stroke="#232F3E" stroke-width="3" stroke-dasharray="9,6" marker-end="url(#arrN)"/>
  <text x="1048" y="566" font-size="15" fill="#232F3E">nach 48 h bereit</text>
  <circle cx="1030" cy="560" r="15" fill="#232F3E"/>
  <text x="1030" y="566" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>

  <path d="M1300,742 L1300,782 L175,782 L175,746" fill="none" stroke="#232F3E" stroke-width="3" stroke-dasharray="9,6" marker-end="url(#arrN)"/>
  <text x="740" y="808" font-size="15" fill="#232F3E" text-anchor="middle">Download der Belege</text>
  <circle cx="740" cy="782" r="15" fill="#232F3E"/>
  <text x="740" y="788" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text>

  <!-- ============ Footer ============ -->

  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  30-Tage-Regel gilt nur für IA, nicht für Glacier · Deep Archive: 180 Tage Minimum, Restore 12/48 h, kein Expedited · Restore kopiert, verschiebt nicht</text>
</svg>
