  <text x="331" y="307" font-size="15" fill="#1B3E86" text-anchor="middle">abholen</text>
  <circle cx="331" cy="325" r="15" fill="#2E6BE6"/>
  <text x="331" y="331" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <line x1="630" y1="325" x2="712" y2="325" stroke="#0F7C8C" stroke-width="3" marker-end="url(#arrT)"/>
  <text x="671" y="307" font-size="15" fill="#0B5A66" text-anchor="middle">zerlegen</text>
  <circle cx="671" cy="325" r="15" fill="#0F7C8C"/>
  <text x="671" y="331" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <line x1="970" y1="325" x2="1052" y2="325" stroke="#D97706" stroke-width="3" marker-end="url(#arrC)"/>
  <text x="1011" y="307" font-size="15" fill="#A85A05" text-anchor="middle">indexieren</text>
  <circle cx="1011" cy="325" r="15" fill="#D97706"/>
  <text x="1011" y="331" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <line x1="1185" y1="400" x2="1185" y2="532" stroke="#3F8624" stroke-width="3" marker-end="url(#arrS)"/>
  <text x="1205" y="470" font-size="15" fill="#2E6318">Suche</text>
  <circle cx="1185" cy="466" r="15" fill="#3F8624"/>
  <text x="1185" y="472" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <line x1="290" y1="615" x2="372" y2="615" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrQ)"/>
  <text x="331" y="597" font-size="15" fill="#1B3E86" text-anchor="middle">fragt</text>
  <circle cx="331" cy="615" r="15" fill="#2E6BE6"/>
  <text x="331" y="621" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>

  <line x1="1052" y1="615" x2="978" y2="615" stroke="#A16E00" stroke-width="3" marker-end="url(#arrG)"/>
  <text x="1015" y="592" font-size="15" fill="#7A5300" text-anchor="middle">steuert</text>
  <circle cx="1015" cy="615" r="15" fill="#A16E00"/>
  <text x="1015" y="621" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>

  <line x1="1318" y1="325" x2="1352" y2="325" stroke="#C7161D" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrX)"/>
  <circle cx="1335" cy="325" r="15" fill="#C7161D"/>
  <text x="1335" y="331" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>

  <circle cx="1335" cy="440" r="20" fill="#FFFFFF" stroke="#C7161D" stroke-width="3"/>
  <line x1="1321" y1="426" x2="1349" y2="454" stroke="#C7161D" stroke-width="4"/>
  <line x1="1349" y1="426" x2="1321" y2="454" stroke="#C7161D" stroke-width="4"/>

  <!-- ===== Footer ===== -->
  <rect x="40" y="830" width="1510" height="52" rx="9" fill="#F4F4F4"/>
  <text x="62" y="863" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  RAG = kein Modelltraining · Retrieve liefert Chunks, RetrieveAndGenerate die fertige Antwort · Agents Classic zu, Knowledge Bases nicht</text>
</svg>
