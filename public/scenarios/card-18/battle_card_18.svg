<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2E6BE6"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#D97706"/></marker>
    <marker id="arrO2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ED7100"/></marker>
    <marker id="arrGr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#3F8624"/></marker>
    <marker id="arrGd" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#A16E00"/></marker>
    <marker id="arrGy" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9A9A9A"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 18 — S3 Transfer Acceleration · Multipart Upload</text>
  <text x="60" y="106" font-size="21" fill="#555555">Weltweite Freelancer laden 40–80 GB Rohmaterial hoch — schnell, wiederaufnehmbar, ohne Müllreste</text>

  <!-- A: Clients -->
  <rect x="50" y="330" width="280" height="175" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="190" y="370" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">Freelancer weltweit</text>
  <text x="190" y="398" font-size="15" fill="#444444" text-anchor="middle">Sydney · São Paulo · Warschau</text>
  <text x="190" y="420" font-size="15" fill="#444444" text-anchor="middle">Rohmaterial 40–80 GB</text>
  <text x="190" y="442" font-size="15" fill="#444444" text-anchor="middle">Browser-Upload, kein FTP</text>
  <text x="190" y="470" font-size="15" fill="#666666" font-style="italic" text-anchor="middle">Netzabbrüche sind normal</text>

  <!-- B: API GW + Lambda -->
  <rect x="490" y="140" width="340" height="150" rx="10" fill="#FEF7EC" stroke="#D97706" stroke-width="2.5"/>
  <text x="660" y="178" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">API Gateway + Lambda</text>
  <text x="660" y="208" font-size="15" fill="#444444" text-anchor="middle">CreateMultipartUpload</text>
  <text x="660" y="230" font-size="15" fill="#444444" text-anchor="middle">presigned URL je Part</text>
  <text x="660" y="258" font-size="15" fill="#666666" font-style="italic" text-anchor="middle">Credentials bleiben serverseitig</text>

  <!-- C: Edge Location -->
  <rect x="490" y="380" width="340" height="160" rx="10" fill="#FDF3E9" stroke="#ED7100" stroke-width="2.5"/>
  <text x="660" y="418" font-size="22" font-weight="bold" fill="#B25400" text-anchor="middle">CloudFront Edge Location</text>
  <text x="660" y="448" font-size="15" fill="#444444" text-anchor="middle">nächstgelegener PoP</text>
  <text x="660" y="470" font-size="15" fill="#444444" text-anchor="middle">bucket.s3-accelerate.amazonaws.com</text>
  <text x="660" y="498" font-size="15" fill="#666666" font-style="italic" text-anchor="middle">danach AWS-Backbone statt Internet</text>

  <!-- D: S3 -->
  <rect x="1020" y="330" width="340" height="210" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="1190" y="370" font-size="21" font-weight="bold" fill="#2E6318" text-anchor="middle">Amazon S3 — eu-central-1</text>
  <text x="1190" y="400" font-size="15" fill="#444444" text-anchor="middle">CompleteMultipartUpload</text>
  <text x="1190" y="422" font-size="15" fill="#444444" text-anchor="middle">setzt die Parts zusammen</text>
  <text x="1190" y="444" font-size="15" fill="#444444" text-anchor="middle">max. 10.000 Parts je Objekt</text>
  <text x="1190" y="466" font-size="15" fill="#444444" text-anchor="middle">Partgröße 5 MiB – 5 GiB</text>
  <text x="1190" y="494" font-size="15" fill="#666666" font-style="italic" text-anchor="middle">ETag endet auf -N (Partzahl)</text>

  <!-- E: Lifecycle -->
  <rect x="1020" y="620" width="340" height="140" rx="10" fill="#FBF5E6" stroke="#A16E00" stroke-width="2.5"/>
  <text x="1190" y="658" font-size="22" font-weight="bold" fill="#7A5300" text-anchor="middle">Lifecycle-Regel</text>
  <text x="1190" y="686" font-size="15" fill="#444444" text-anchor="middle">AbortIncompleteMultipartUpload</text>
  <text x="1190" y="708" font-size="15" fill="#444444" text-anchor="middle">räumt Teile nach 7 Tagen weg</text>
  <text x="1190" y="736" font-size="15" fill="#666666" font-style="italic" text-anchor="middle">sonst zahlt man für Müll</text>

  <!-- F: Abgrenzung -->
  <rect x="50" y="610" width="800" height="180" rx="10" fill="#F7F1F1" stroke="#9A9A9A" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="70" y="648" font-size="20" font-weight="bold" fill="#555555">Nicht verwechseln</text>
  <text x="70" y="680" font-size="15" fill="#444444">S3 Transfer Acceleration: schneller Upload IN einen Bucket (Edge + Backbone)</text>
  <text x="70" y="704" font-size="15" fill="#444444">CloudFront: Auslieferung und Caching HERAUS zu den Nutzern</text>
  <text x="70" y="728" font-size="15" fill="#444444">Global Accelerator: statische Anycast-IPs für TCP/UDP-Anwendungen (Karte 35)</text>
  <text x="70" y="752" font-size="15" fill="#444444">Multi-Region Access Points: ein Endpoint über mehrere Bucket-Regionen</text>

  <!-- verworfen: Long-Haul -->
  <line x1="330" y1="360" x2="1020" y2="360" stroke="#9A9A9A" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrGy)"/>
  <text x="380" y="332" font-size="16" fill="#555555">verworfen: Long-Haul über das öffentliche Internet</text>
  <circle cx="660" cy="360" r="20" fill="#FFFFFF" stroke="#C7161D" stroke-width="3"/>
  <line x1="647" y1="347" x2="673" y2="373" stroke="#C7161D" stroke-width="4"/>
  <line x1="673" y1="347" x2="647" y2="373" stroke="#C7161D" stroke-width="4"/>

  <!-- 1: Client -> API -->
  <path d="M190,330 L190,215 L490,215" fill="none" stroke="#D97706" stroke-width="3" marker-end="url(#arrO)"/>
  <text x="215" y="193" font-size="16" fill="#A85A05">presigned URLs anfordern</text>
  <circle cx="190" cy="275" r="15" fill="#D97706"/>
  <text x="190" y="281" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- 2: Client -> Edge -->
  <line x1="330" y1="420" x2="490" y2="420" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="345" y="454" font-size="16" fill="#1B3E86">Parts parallel</text>
  <text x="345" y="476" font-size="16" fill="#1B3E86">64 MB je Part</text>
  <circle cx="400" cy="420" r="15" fill="#2E6BE6"/>
  <text x="400" y="426" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- 3: Edge -> S3 -->
  <line x1="830" y1="420" x2="1020" y2="420" stroke="#ED7100" stroke-width="3" marker-end="url(#arrO2)"/>
  <text x="850" y="452" font-size="16" fill="#B25400">AWS-Backbone</text>
  <text x="850" y="474" font-size="16" fill="#B25400">optimierte Route</text>
  <circle cx="920" cy="420" r="15" fill="#ED7100"/>
  <text x="920" y="426" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- 4: Retry -->
  <line x1="490" y1="500" x2="330" y2="500" stroke="#2E6BE6" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrB)"/>
  <text x="345" y="532" font-size="16" fill="#1B3E86">Part neu senden</text>
  <circle cx="400" cy="500" r="15" fill="#2E6BE6"/>
  <text x="400" y="506" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- 5: Complete -->
  <path d="M190,505 L190,580 L1100,580 L1100,540" fill="none" stroke="#3F8624" stroke-width="3" marker-end="url(#arrGr)"/>
  <text x="620" y="560" font-size="16" fill="#2E6318">CompleteMultipartUpload</text>
  <circle cx="700" cy="580" r="15" fill="#3F8624"/>
  <text x="700" y="586" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>

  <!-- 6: Lifecycle -->
  <line x1="1280" y1="540" x2="1280" y2="620" stroke="#A16E00" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrGd)"/>
  <text x="1120" y="602" font-size="16" fill="#7A5300">nach 7 Tagen</text>
  <circle cx="1280" cy="580" r="15" fill="#A16E00"/>
  <text x="1280" y="586" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>

  <!-- Footer -->
  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  TA = Edge-Eintritt + AWS-Backbone · Multipart ab ~100 MB, max. 10.000 Parts · nur der fehlerhafte Part neu · TA ohne Nutzen ist gratis</text>
</svg>
