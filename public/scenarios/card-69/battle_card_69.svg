<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrQ" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2E6BE6"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0F7C8C"/>
    </marker>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#D97706"/>
    </marker>
    <marker id="arrS" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3F8624"/>
    </marker>
    <marker id="arrX" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#C7161D"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 69 — Kendra → Bedrock Managed Knowledge Base</text>
  <text x="60" y="106" font-size="21" fill="#555555">Enterprise-Suche über Confluence, SharePoint und S3 — der Nachfolger ist in RAG stärker und in der Suche schwächer</text>

  <!-- ===== Oberzeile: Migrationsfluss ===== -->

  <rect x="40" y="250" width="250" height="150" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="165" y="288" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">7 Konnektoren</text>
  <text x="165" y="318" font-size="15" fill="#444444" text-anchor="middle">S3, Confluence,</text>
  <text x="165" y="342" font-size="15" fill="#444444" text-anchor="middle">SharePoint, Drive,</text>
  <text x="165" y="366" font-size="15" fill="#444444" text-anchor="middle">OneDrive, Web, Custom</text>
  <text x="165" y="390" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Kendra hatte 32+</text>

  <rect x="380" y="250" width="250" height="150" rx="10" fill="#FEF7EC" stroke="#D97706" stroke-width="2.5"/>
  <text x="505" y="288" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">BMKB Ingestion</text>
  <text x="505" y="318" font-size="15" fill="#444444" text-anchor="middle">Smart Parsing</text>
  <text x="505" y="342" font-size="15" fill="#444444" text-anchor="middle">Chunking explizit</text>
  <text x="505" y="368" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">wählen — Kendra</text>
  <text x="505" y="390" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">machte das intern</text>

  <rect x="720" y="250" width="250" height="150" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="845" y="286" font-size="22" font-weight="bold" fill="#2E6318" text-anchor="middle">Managed</text>
  <text x="845" y="312" font-size="22" font-weight="bold" fill="#2E6318" text-anchor="middle">Vector Store</text>
  <text x="845" y="342" font-size="15" fill="#444444" text-anchor="middle">von Bedrock betrieben</text>
  <text x="845" y="366" font-size="15" fill="#444444" text-anchor="middle">immer Hybrid-Suche</text>
  <text x="845" y="390" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">kein Semantic-only</text>

  <rect x="1060" y="250" width="250" height="150" rx="10" fill="#FEF7EC" stroke="#D97706" stroke-width="2.5"/>
  <text x="1185" y="286" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">Retrieve-</text>
  <text x="1185" y="312" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">AndGenerate</text>
  <text x="1185" y="342" font-size="15" fill="#444444" text-anchor="middle">Antwort mit Zitaten</text>
  <text x="1185" y="366" font-size="15" fill="#444444" text-anchor="middle">Agentic Retrieval</text>
  <text x="1185" y="390" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">kann Kendra nicht</text>

  <!-- ===== Verworfen: Selbstbau ===== -->
  <rect x="1360" y="250" width="200" height="150" rx="10" fill="#FEF7EC" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="1460" y="288" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">Selbstbau</text>
  <text x="1460" y="318" font-size="15" fill="#444444" text-anchor="middle">OpenSearch</text>
  <text x="1460" y="342" font-size="15" fill="#444444" text-anchor="middle">selbst betreiben</text>
  <text x="1460" y="368" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Chunking, Sync,</text>
  <text x="1460" y="390" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Ranking selbst</text>

  <!-- ===== Unterzeile links: nicht unterstützte Quellen ===== -->

  <rect x="40" y="560" width="250" height="130" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="165" y="596" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">ServiceNow,</text>
  <text x="165" y="622" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">Salesforce</text>
  <text x="165" y="652" font-size="15" fill="#444444" text-anchor="middle">nicht unterstützt</text>
  <text x="165" y="676" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">von BMKB</text>

  <rect x="380" y="560" width="250" height="130" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="505" y="598" font-size="22" font-weight="bold" fill="#0B5A66" text-anchor="middle">Export nach S3</text>
  <text x="505" y="628" font-size="15" fill="#444444" text-anchor="middle">Lambda / Step Fn /</text>
  <text x="505" y="652" font-size="15" fill="#444444" text-anchor="middle">EventBridge Sched.</text>
  <text x="505" y="676" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Pipeline selbst bauen</text>

  <!-- ===== Feature-Lücken-Box ===== -->
  <rect x="720" y="470" width="590" height="220" rx="10" fill="#FBF5E6" stroke="#A16E00" stroke-width="2.5"/>
  <text x="1015" y="512" font-size="22" font-weight="bold" fill="#7A5300" text-anchor="middle">Was BMKB nicht kann</text>
  <text x="1015" y="556" font-size="15" fill="#444444" text-anchor="middle">Query Suggestions · Faceted Search</text>
  <text x="1015" y="586" font-size="15" fill="#444444" text-anchor="middle">Custom Synonyms · Spell Checking</text>
  <text x="1015" y="616" font-size="15" fill="#444444" text-anchor="middle">Incremental Learning · Doc Enrichment</text>
  <text x="1015" y="656" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">alle mit Workaround, keiner geschenkt</text>

  <!-- ===== Randleiste: Kendra-Status ===== -->
  <rect x="40" y="750" width="1510" height="56" rx="9" fill="#FBF5E6" stroke="#A16E00" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="62" y="784" font-size="17" fill="#7A5300"><tspan font-weight="bold">Amazon Kendra</tspan> — Maintenance Mode ab 30.06.2026, für Neukunden zu ab 30.07.2026. Kein Enddatum, Bestandskunden voll unterstützt.</text>

  <!-- ===== Segmente ===== -->

