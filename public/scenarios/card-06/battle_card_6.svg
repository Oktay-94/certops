<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2E6BE6"/></marker>
    <marker id="arrN" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#232F3E"/></marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ED7100"/></marker>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7A3FE0"/></marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0F7C8C"/></marker>
    <marker id="arrGr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9A9A9A"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 6 — EKS · Karpenter · Spot</text>
  <text x="60" y="106" font-size="21" fill="#555555">Kubernetes-Workload kostenoptimal: Spot-Nodes fur unkritische Pods, Autoscaler skaliert bedarfsgerecht</text>

  <!-- DEV -->
  <rect x="40" y="190" width="210" height="120" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="145" y="232" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">Developer</text>
  <text x="145" y="262" font-size="16" fill="#444444" text-anchor="middle">kubectl apply</text>
  <text x="145" y="288" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Pods bleiben Pending</text>

  <!-- EKS -->
  <rect x="330" y="185" width="240" height="130" rx="10" fill="#EDF0F4" stroke="#232F3E" stroke-width="2.5"/>
  <text x="450" y="225" font-size="22" font-weight="bold" fill="#232F3E" text-anchor="middle">EKS Control Plane</text>
  <text x="450" y="255" font-size="16" fill="#444444" text-anchor="middle">managed · kube-scheduler</text>
  <text x="450" y="283" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">keine Kapazitat frei</text>

  <!-- KARPENTER -->
  <rect x="650" y="185" width="250" height="130" rx="10" fill="#FDF3E9" stroke="#ED7100" stroke-width="2.5"/>
  <text x="775" y="225" font-size="22" font-weight="bold" fill="#B25400" text-anchor="middle">Karpenter</text>
  <text x="775" y="255" font-size="16" fill="#444444" text-anchor="middle">beobachtet Pending Pods</text>
  <text x="775" y="283" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">wahlt gunstigste Instanz</text>

  <!-- ON-DEMAND NODEPOOL -->
  <rect x="1080" y="160" width="300" height="130" rx="10" fill="#EDF0F4" stroke="#232F3E" stroke-width="2.5"/>
  <text x="1230" y="200" font-size="21" font-weight="bold" fill="#232F3E" text-anchor="middle">On-Demand NodePool</text>
  <text x="1230" y="230" font-size="16" fill="#444444" text-anchor="middle">kritische / stateful Pods</text>
  <text x="1230" y="258" font-size="16" fill="#444444" text-anchor="middle">EC2 On-Demand Nodes</text>

  <!-- SPOT NODEPOOL -->
  <rect x="1080" y="330" width="300" height="130" rx="10" fill="#FBF5E6" stroke="#A16E00" stroke-width="2.5"/>
  <text x="1230" y="370" font-size="21" font-weight="bold" fill="#7A5300" text-anchor="middle">Spot NodePool</text>
  <text x="1230" y="400" font-size="16" fill="#444444" text-anchor="middle">unkritische / stateless Pods</text>
  <text x="1230" y="428" font-size="16" fill="#444444" text-anchor="middle">EC2 Spot Nodes (gunstig)</text>

  <!-- EVENTBRIDGE -->
  <rect x="1080" y="560" width="300" height="110" rx="10" fill="#F5F0FE" stroke="#7A3FE0" stroke-width="2.5"/>
  <text x="1230" y="598" font-size="21" font-weight="bold" fill="#5B2BAF" text-anchor="middle">EventBridge Rule</text>
  <text x="1230" y="626" font-size="16" fill="#444444" text-anchor="middle">EC2 Spot Interruption</text>
  <text x="1230" y="651" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">2-Min-Notice</text>

  <!-- SQS INTERRUPTION QUEUE -->
  <rect x="740" y="560" width="290" height="110" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="885" y="598" font-size="19" font-weight="bold" fill="#0B5A66" text-anchor="middle">SQS Interruption Queue</text>
  <text x="885" y="628" font-size="16" fill="#444444" text-anchor="middle">Interruption-Events puffern</text>

  <!-- CLUSTER AUTOSCALER (REJECTED) -->
  <rect x="40" y="560" width="340" height="150" rx="10" fill="#F7F1F1" stroke="#9A9A9A" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="210" y="598" font-size="21" font-weight="bold" fill="#555555" text-anchor="middle">Cluster Autoscaler</text>
  <text x="210" y="626" font-size="15" fill="#444444" text-anchor="middle">nur vordefinierte Node Groups (ASGs)</text>
  <text x="210" y="650" font-size="15" fill="#444444" text-anchor="middle">langsamer 3–5 min · Instanz-Typ fix</text>
  <text x="210" y="682" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">entweder Karpenter ODER CAS</text>

  <!-- ARROW 1: DEV -> EKS -->
  <line x1="250" y1="250" x2="330" y2="250" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <text x="290" y="222" font-size="15" fill="#1B3E86" text-anchor="middle">Deploy</text>
  <circle cx="290" cy="250" r="15" fill="#2E6BE6"/><text x="290" y="256" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <!-- ARROW 2: EKS -> KARPENTER -->
  <line x1="570" y1="250" x2="650" y2="250" stroke="#232F3E" stroke-width="3" marker-end="url(#arrN)"/>
  <text x="610" y="222" font-size="15" fill="#232F3E" text-anchor="middle">Pending</text>
  <circle cx="610" cy="250" r="15" fill="#232F3E"/><text x="610" y="256" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

  <!-- ARROW 3: KARPENTER -> ON-DEMAND NODEPOOL -->
  <line x1="900" y1="225" x2="1080" y2="215" stroke="#ED7100" stroke-width="3" marker-end="url(#arrO)"/>
  <text x="990" y="200" font-size="15" fill="#B25400" text-anchor="middle">provision On-Demand</text>
  <circle cx="990" cy="220" r="15" fill="#ED7100"/><text x="990" y="226" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <!-- ARROW 4: KARPENTER -> SPOT NODEPOOL -->
  <line x1="900" y1="285" x2="1080" y2="385" stroke="#ED7100" stroke-width="3" marker-end="url(#arrO)"/>
  <text x="960" y="307" font-size="15" fill="#B25400" text-anchor="middle">provision Spot</text>
  <circle cx="990" cy="335" r="15" fill="#ED7100"/><text x="990" y="341" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- ARROW 5: SPOT NODEPOOL -> EVENTBRIDGE (dashed) -->
  <line x1="1230" y1="460" x2="1230" y2="560" stroke="#7A3FE0" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrP)"/>
  <text x="1330" y="515" font-size="15" fill="#5B2BAF" text-anchor="middle">Interruption</text>
  <circle cx="1230" cy="510" r="15" fill="#7A3FE0"/><text x="1230" y="516" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>

  <!-- ARROW 5b: EVENTBRIDGE -> SQS (dashed) -->
  <line x1="1080" y1="615" x2="1030" y2="615" stroke="#7A3FE0" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrP)"/>

  <!-- ARROW 6: SQS -> KARPENTER (dashed) -->
  <line x1="860" y1="560" x2="822" y2="315" stroke="#0F7C8C" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrT)"/>
  <text x="700" y="440" font-size="15" fill="#0B5A66" text-anchor="middle">cordon + drain,</text>
  <text x="700" y="458" font-size="15" fill="#0B5A66" text-anchor="middle">Ersatz-Node</text>
  <circle cx="841" cy="437" r="15" fill="#0F7C8C"/><text x="841" y="443" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>

  <!-- REJECTED PATH: EKS -> CAS with red X (dashed gray) -->
  <line x1="400" y1="315" x2="235" y2="560" stroke="#9A9A9A" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrGr)"/>
  <text x="430" y="450" font-size="15" fill="#9E1015" text-anchor="middle">nicht CAS</text>
  <circle cx="317" cy="437" r="20" fill="#FFFFFF" stroke="#C7161D" stroke-width="3"/>
  <line x1="304" y1="424" x2="330" y2="450" stroke="#C7161D" stroke-width="4"/>
  <line x1="330" y1="424" x2="304" y2="450" stroke="#C7161D" stroke-width="4"/>

  <!-- FOOTER -->
  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  Karpenter provisioniert EC2 direkt (keine Node Groups) · native Spot + On-Demand-Fallback · CAS nur vordefinierte ASGs · entweder Karpenter ODER CAS</text>
</svg>
