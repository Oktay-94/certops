<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3F8624"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#ED7100"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#C7161D"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 40 — Athena · Glue · S3 Data Lake</text>
  <text x="60" y="106" font-size="21" fill="#555555">Ad-hoc-SQL ohne Cluster — der Preis steht nicht in der Query, sondern im Speicherlayout</text>

  <!-- Falle: SELECT * -->
  <rect x="1000" y="130" width="440" height="125" rx="10" fill="#FDEEEE" stroke="#C7161D" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="1220" y="166" font-size="20" font-weight="bold" fill="#9E1015" text-anchor="middle">Falle: SELECT * auf die Rohzone</text>
  <text x="1220" y="194" font-size="15" fill="#444444" text-anchor="middle">kein Spaltenschnitt, kein Partitionsfilter</text>
  <text x="1220" y="217" font-size="15" fill="#444444" text-anchor="middle">3 TB gescannt = 15 USD je Abfrage</text>
  <text x="1220" y="240" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">DDL und fehlgeschlagene Abfragen sind frei</text>

  <!-- S3 Rohzone -->
  <rect x="40" y="300" width="230" height="160" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="155" y="345" font-size="20" font-weight="bold" fill="#2E6318" text-anchor="middle">S3 Rohzone</text>
  <text x="155" y="378" font-size="15" fill="#444444" text-anchor="middle">JSON, unpartitioniert</text>
  <text x="155" y="401" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">3 TB Telematik</text>

  <!-- Glue ETL -->
  <rect x="340" y="300" width="260" height="160" rx="10" fill="#FDF3E9" stroke="#ED7100" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="470" y="345" font-size="20" font-weight="bold" fill="#B25400" text-anchor="middle">Glue ETL</text>
  <text x="470" y="378" font-size="15" fill="#444444" text-anchor="middle">nach Parquet wandeln</text>
  <text x="470" y="401" font-size="15" fill="#444444" text-anchor="middle">nach Tag partitionieren</text>
  <text x="470" y="424" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">läuft periodisch</text>

  <!-- S3 Kuratiert -->
  <rect x="670" y="300" width="260" height="160" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="800" y="345" font-size="20" font-weight="bold" fill="#2E6318" text-anchor="middle">S3 Kuratiert</text>
  <text x="800" y="378" font-size="15" fill="#444444" text-anchor="middle">Parquet + Snappy</text>
  <text x="800" y="401" font-size="15" fill="#444444" text-anchor="middle">dt=2026-07-19/</text>
  <text x="800" y="424" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">0,33 TB statt 3 TB</text>

  <!-- Athena -->
  <rect x="1000" y="300" width="260" height="160" rx="10" fill="#F5F0FE" stroke="#7A3FE0" stroke-width="2.5"/>
  <text x="1130" y="347" font-size="22" font-weight="bold" fill="#5B2BAF" text-anchor="middle">Athena</text>
  <text x="1130" y="380" font-size="15" fill="#444444" text-anchor="middle">serverless, kein Cluster</text>
  <text x="1130" y="403" font-size="15" fill="#444444" text-anchor="middle">5 USD je TB gescannt</text>
  <text x="1130" y="426" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">10 MB Mindestmenge</text>

  <!-- QuickSight -->
  <rect x="1330" y="300" width="230" height="160" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="1445" y="360" font-size="20" font-weight="bold" fill="#1B3E86" text-anchor="middle">QuickSight / BI</text>
  <text x="1445" y="393" font-size="15" fill="#444444" text-anchor="middle">Ergebnis aus S3</text>

  <!-- Glue Data Catalog -->
  <rect x="500" y="560" width="600" height="130" rx="10" fill="#FDF3E9" stroke="#ED7100" stroke-width="2.5"/>
  <text x="800" y="605" font-size="22" font-weight="bold" fill="#B25400" text-anchor="middle">Glue Data Catalog</text>
  <text x="800" y="638" font-size="15" fill="#444444" text-anchor="middle">Tabellen, Spalten, Partitionen — ein Schema für Athena, Spectrum und EMR</text>
  <text x="800" y="663" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Metadaten, keine Daten: der Katalog speichert Zeiger, nicht Zeilen</text>

  <!-- Partition Projection -->
  <rect x="40" y="560" width="400" height="130" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="240" y="598" font-size="20" font-weight="bold" fill="#0B5A66" text-anchor="middle">Partition Projection</text>
  <text x="240" y="630" font-size="15" fill="#444444" text-anchor="middle">berechnet Partitionen aus der</text>
  <text x="240" y="653" font-size="15" fill="#444444" text-anchor="middle">Tabellenkonfiguration statt Katalog</text>
  <text x="240" y="676" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">schlechter bei vielen leeren Partitionen</text>

  <!-- Versteckte Kosten -->
  <rect x="1160" y="560" width="400" height="130" rx="10" fill="#FBF5E6" stroke="#A16E00" stroke-width="2.5"/>
  <text x="1360" y="598" font-size="20" font-weight="bold" fill="#7A5300" text-anchor="middle">Versteckte Kosten</text>
  <text x="1360" y="630" font-size="15" fill="#444444" text-anchor="middle">S3-GET je Datei, Glue-Requests</text>
  <text x="1360" y="653" font-size="15" fill="#444444" text-anchor="middle">viele kleine Dateien = teuer</text>
  <text x="1360" y="676" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">taucht nicht unter Athena auf</text>

  <!-- Datenfluss -->
  <path d="M270,380 L340,380" stroke="#3F8624" stroke-width="3" fill="none" marker-end="url(#arrG)"/>
  <path d="M600,380 L670,380" stroke="#3F8624" stroke-width="3" fill="none" marker-end="url(#arrG)"/>
  <path d="M930,380 L1000,380" stroke="#3F8624" stroke-width="3" fill="none" marker-end="url(#arrG)"/>
  <path d="M1260,380 L1330,380" stroke="#3F8624" stroke-width="3" fill="none" marker-end="url(#arrG)"/>

  <!-- Katalog-Beziehungen -->
  <path d="M470,460 L470,520 L600,520 L600,560" stroke="#ED7100" stroke-width="3" stroke-dasharray="8,6" fill="none" marker-end="url(#arrO)"/>
  <path d="M1000,560 L1000,520 L1130,520 L1130,460" stroke="#ED7100" stroke-width="3" stroke-dasharray="8,6" fill="none" marker-end="url(#arrO)"/>

  <!-- Verworfen: SELECT * -->
  <path d="M1130,300 L1130,255" stroke="#C7161D" stroke-width="3" stroke-dasharray="8,6" fill="none" marker-end="url(#arrR)"/>
  <circle cx="1130" cy="278" r="20" fill="#FFFFFF" stroke="#C7161D" stroke-width="3"/>
  <line x1="1116" y1="264" x2="1144" y2="292" stroke="#C7161D" stroke-width="4"/>
  <line x1="1144" y1="264" x2="1116" y2="292" stroke="#C7161D" stroke-width="4"/>

  <!-- Nummern-Badges -->
  <circle cx="305" cy="380" r="15" fill="#3F8624"/>
  <text x="305" y="386" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="635" cy="380" r="15" fill="#3F8624"/>
  <text x="635" y="386" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="470" cy="490" r="15" fill="#ED7100"/>
  <text x="470" y="496" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="1000" cy="540" r="15" fill="#ED7100"/>
  <text x="1000" y="546" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="965" cy="380" r="15" fill="#3F8624"/>
  <text x="965" y="386" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <circle cx="1295" cy="380" r="15" fill="#3F8624"/>
  <text x="1295" y="386" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>

  <!-- Footer -->
  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  Athena zahlt gescannte Bytes · Parquet + Partitionen sparen ~90 % · Katalog ist Metadaten, ETL ist Arbeit · Spectrum braucht einen Cluster</text>
</svg>
