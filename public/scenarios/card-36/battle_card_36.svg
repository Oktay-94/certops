<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrP" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7A3FE0"/>
    </marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#C7161D"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 36 — Route 53 Routing Policies</text>
  <text x="60" y="106" font-size="21" fill="#555555">Vier Record-Ebenen in einer DNS-Antwort: Compliance-Grenze, Tempo, Ausfall, Rollout</text>

  <!-- Zone: EU-Datengrenze -->
  <rect x="505" y="170" width="1055" height="558" rx="10" fill="none" stroke="#9A9A9A" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="1033" y="196" font-size="18" font-weight="bold" fill="#888888" text-anchor="middle">EU-DATENGRENZE — DATENRESIDENZ</text>

  <!-- Client -->
  <rect x="40" y="325" width="175" height="110" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="128" y="362" font-size="20" font-weight="bold" fill="#1B3E86" text-anchor="middle">Nutzer</text>
  <text x="128" y="390" font-size="15" fill="#444444" text-anchor="middle">München, DE</text>
  <text x="128" y="413" font-size="15" fill="#444444" text-anchor="middle">app.vermeer.eu</text>

  <!-- Ebene 1: Geolocation -->
  <rect x="280" y="310" width="210" height="140" rx="10" fill="#F5F0FE" stroke="#7A3FE0" stroke-width="2.5"/>
  <text x="385" y="348" font-size="21" font-weight="bold" fill="#5B2BAF" text-anchor="middle">Geolocation</text>
  <text x="385" y="378" font-size="15" fill="#444444" text-anchor="middle">Europa → EU-Baum</text>
  <text x="385" y="401" font-size="15" fill="#444444" text-anchor="middle">N-Amerika → us-east-1</text>
  <text x="385" y="424" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Default (*) ist Pflicht</text>

  <!-- Ebene 2: Failover -->
  <rect x="555" y="310" width="210" height="140" rx="10" fill="#F5F0FE" stroke="#7A3FE0" stroke-width="2.5"/>
  <text x="660" y="348" font-size="21" font-weight="bold" fill="#5B2BAF" text-anchor="middle">Failover</text>
  <text x="660" y="378" font-size="15" fill="#444444" text-anchor="middle">Primary: EU-Latenzsatz</text>
  <text x="660" y="401" font-size="15" fill="#444444" text-anchor="middle">Secondary: Wartung</text>
  <text x="660" y="424" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Evaluate Target Health</text>

  <!-- Ebene 3: Latency -->
  <rect x="830" y="310" width="210" height="140" rx="10" fill="#F5F0FE" stroke="#7A3FE0" stroke-width="2.5"/>
  <text x="935" y="348" font-size="21" font-weight="bold" fill="#5B2BAF" text-anchor="middle">Latency</text>
  <text x="935" y="378" font-size="15" fill="#444444" text-anchor="middle">eu-central-1 gewinnt</text>
  <text x="935" y="401" font-size="15" fill="#444444" text-anchor="middle">eu-west-1 als zweiter</text>
  <text x="935" y="424" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Health Check je Record</text>

  <!-- Ebene 4: Weighted -->
  <rect x="1105" y="310" width="210" height="140" rx="10" fill="#F5F0FE" stroke="#7A3FE0" stroke-width="2.5"/>
  <text x="1210" y="348" font-size="21" font-weight="bold" fill="#5B2BAF" text-anchor="middle">Weighted</text>
  <text x="1210" y="378" font-size="15" fill="#444444" text-anchor="middle">90 Blue / 10 Green</text>
  <text x="1210" y="401" font-size="15" fill="#444444" text-anchor="middle">TTL 60 s</text>
  <text x="1210" y="424" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Canary nur in Frankfurt</text>

  <!-- Ziele Blue / Green -->
  <rect x="1370" y="215" width="175" height="110" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="1458" y="252" font-size="20" font-weight="bold" fill="#2E6318" text-anchor="middle">ALB v4.2</text>
  <text x="1458" y="280" font-size="15" fill="#444444" text-anchor="middle">eu-central-1</text>
  <text x="1458" y="303" font-size="15" fill="#444444" text-anchor="middle">90 % Traffic</text>

  <rect x="1370" y="435" width="175" height="110" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="1458" y="472" font-size="20" font-weight="bold" fill="#2E6318" text-anchor="middle">ALB v4.3</text>
  <text x="1458" y="500" font-size="15" fill="#444444" text-anchor="middle">eu-central-1</text>
  <text x="1458" y="523" font-size="15" fill="#444444" text-anchor="middle">10 % Canary</text>

  <!-- us-east-1 (Nordamerika-Zweig, ausserhalb der EU-Zone) -->
  <rect x="245" y="580" width="210" height="120" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="350" y="618" font-size="20" font-weight="bold" fill="#2E6318" text-anchor="middle">us-east-1</text>
  <text x="350" y="646" font-size="15" fill="#444444" text-anchor="middle">Nordamerika + Default</text>
  <text x="350" y="669" font-size="15" fill="#444444" text-anchor="middle">eigene Datenbasis</text>

  <!-- Wartungsseite (Failover-Secondary) -->
  <rect x="555" y="580" width="210" height="120" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="660" y="618" font-size="20" font-weight="bold" fill="#2E6318" text-anchor="middle">Wartungsseite</text>
  <text x="660" y="646" font-size="15" fill="#444444" text-anchor="middle">S3, eu-central-1</text>
  <text x="660" y="669" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Secondary, passiv</text>

  <!-- eu-west-1 (zweiter Latency-Endpunkt) -->
  <rect x="830" y="580" width="210" height="120" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="935" y="618" font-size="20" font-weight="bold" fill="#2E6318" text-anchor="middle">eu-west-1</text>
  <text x="935" y="646" font-size="15" fill="#444444" text-anchor="middle">nur v4.2</text>
  <text x="935" y="669" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">höhere Latenz</text>

  <!-- Warnbox: fehlender Default-Record -->
  <rect x="40" y="580" width="195" height="120" rx="10" fill="#FDEEEE" stroke="#C7161D" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="138" y="615" font-size="18" font-weight="bold" fill="#9E1015" text-anchor="middle">Ohne Default (*)</text>
  <text x="138" y="642" font-size="15" fill="#444444" text-anchor="middle">NOERROR, aber</text>
  <text x="138" y="665" font-size="15" fill="#444444" text-anchor="middle">ANSWER-Sektion leer</text>

  <!-- Hauptfluss 1-6 -->
  <path d="M215,380 L280,380" stroke="#7A3FE0" stroke-width="3" fill="none" marker-end="url(#arrP)"/>
  <path d="M490,380 L555,380" stroke="#7A3FE0" stroke-width="3" fill="none" marker-end="url(#arrP)"/>
  <path d="M765,380 L830,380" stroke="#7A3FE0" stroke-width="3" fill="none" marker-end="url(#arrP)"/>
  <path d="M1040,380 L1105,380" stroke="#7A3FE0" stroke-width="3" fill="none" marker-end="url(#arrP)"/>
  <path d="M1315,380 L1342,380 L1342,270 L1370,270" stroke="#7A3FE0" stroke-width="3" fill="none" marker-end="url(#arrP)"/>
  <path d="M1315,380 L1342,380 L1342,490 L1370,490" stroke="#7A3FE0" stroke-width="3" fill="none" marker-end="url(#arrP)"/>

  <!-- Nebenpfad: Nordamerika-Zweig -->
  <path d="M440,450 L440,480 L340,480 L340,580" stroke="#7A3FE0" stroke-width="3" fill="none" marker-end="url(#arrP)"/>
  <text x="385" y="465" font-size="15" fill="#5B2BAF" text-anchor="middle">Nordamerika</text>

  <!-- Nebenpfad: Failover-Secondary -->
  <path d="M660,450 L660,580" stroke="#7A3FE0" stroke-width="3" stroke-dasharray="8,6" fill="none" marker-end="url(#arrP)"/>
  <text x="672" y="520" font-size="15" fill="#5B2BAF">alle EU unhealthy</text>

  <!-- Nebenpfad: zweiter Latency-Endpunkt -->
  <path d="M935,450 L935,580" stroke="#7A3FE0" stroke-width="3" stroke-dasharray="8,6" fill="none" marker-end="url(#arrP)"/>
  <text x="947" y="520" font-size="15" fill="#5B2BAF">eu-west-1</text>

  <!-- Verworfen: Failover ueber die EU-Grenze hinweg -->
  <path d="M600,450 L600,545 L505,545 L505,640 L455,640" stroke="#C7161D" stroke-width="3" stroke-dasharray="8,6" fill="none" marker-end="url(#arrR)"/>
  <text x="505" y="505" font-size="15" font-weight="bold" fill="#9E1015" text-anchor="middle">Compliance-Bruch</text>
  <circle cx="505" cy="545" r="20" fill="#FFFFFF" stroke="#C7161D" stroke-width="3"/>
  <line x1="491" y1="531" x2="519" y2="559" stroke="#C7161D" stroke-width="4"/>
  <line x1="519" y1="531" x2="491" y2="559" stroke="#C7161D" stroke-width="4"/>

  <!-- Verworfen: fehlender Default-Record -->
  <path d="M310,450 L310,555 L140,555 L140,580" stroke="#C7161D" stroke-width="3" stroke-dasharray="8,6" fill="none" marker-end="url(#arrR)"/>
  <text x="225" y="535" font-size="15" fill="#9E1015" text-anchor="middle">unbekannte IP</text>

  <!-- Nummern-Badges -->
  <circle cx="248" cy="380" r="15" fill="#7A3FE0"/>
  <text x="248" y="386" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="528" cy="380" r="15" fill="#7A3FE0"/>
  <text x="528" y="386" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="797" cy="380" r="15" fill="#7A3FE0"/>
  <text x="797" y="386" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="1072" cy="380" r="15" fill="#7A3FE0"/>
  <text x="1072" y="386" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="1342" cy="320" r="15" fill="#7A3FE0"/>
  <text x="1342" y="326" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <circle cx="1342" cy="440" r="15" fill="#7A3FE0"/>
  <text x="1342" y="446" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>

  <!-- Footer -->
  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  Geolocation = Regel (Compliance) · Latency = Messung (Tempo) · Failover-Secondary bleibt in der EU · ohne Default-Record: „no answer“</text>
</svg>
