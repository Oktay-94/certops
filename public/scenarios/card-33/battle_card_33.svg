  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 33 — AWS PrivateLink</text>
  <text x="60" y="106" font-size="21" fill="#555555">SaaS für 40 Kunden privat anbieten: ohne Routen, ohne IP-Allowlist, trotz doppelter CIDR</text>

  <text x="500" y="135" font-size="15" fill="#9E1015" text-anchor="middle">Provider kann nicht zurück</text>
  <line x1="698" y1="160" x2="300" y2="160" stroke="#C7161D" stroke-width="3" marker-end="url(#arrR)"/>
  <circle cx="500" cy="160" r="20" fill="#FFFFFF" stroke="#C7161D" stroke-width="3"/>
  <line x1="488" y1="148" x2="512" y2="172" stroke="#C7161D" stroke-width="4"/>
  <line x1="512" y1="148" x2="488" y2="172" stroke="#C7161D" stroke-width="4"/>

  <rect x="700" y="150" width="560" height="420" rx="10" fill="#F7F1F1" stroke="#9A9A9A" stroke-width="2.5" stroke-dasharray="4,4"/>
  <text x="980" y="185" font-size="18" font-weight="bold" fill="#888888" text-anchor="middle">PROVIDER-VPC TELEMETRIK24 · 10.0.0.0/16</text>

  <rect x="50" y="180" width="230" height="95" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="165" y="212" font-size="20" font-weight="bold" fill="#1B3E86" text-anchor="middle">Kunde A</text>
  <text x="165" y="238" font-size="15" fill="#444444" text-anchor="middle">VPC 172.16.0.0/16</text>
  <text x="165" y="260" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">eigener Account</text>

  <line x1="280" y1="227" x2="368" y2="227" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <circle cx="324" cy="227" r="15" fill="#2E6BE6"/>
  <text x="324" y="233" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>

  <rect x="370" y="185" width="215" height="85" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="477" y="213" font-size="17" font-weight="bold" fill="#2E6318" text-anchor="middle">Interface Endpoint</text>
  <text x="477" y="236" font-size="15" fill="#444444" text-anchor="middle">ENI, private IP</text>
  <text x="477" y="257" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">im Kunden-Subnetz</text>

  <text x="666" y="200" font-size="14" fill="#2E6318" text-anchor="middle">über PrivateLink</text>
  <line x1="585" y1="227" x2="748" y2="275" stroke="#3F8624" stroke-width="3" marker-end="url(#arrGr)"/>
  <circle cx="666" cy="251" r="15" fill="#3F8624"/>
  <text x="666" y="257" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>

