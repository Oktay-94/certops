  <text x="875" y="310" font-size="15" fill="#444444" text-anchor="middle">TCP und UDP</text>

  <line x1="1000" y1="295" x2="1058" y2="295" stroke="#232F3E" stroke-width="3" marker-end="url(#arrN)"/>
  <circle cx="1029" cy="295" r="15" fill="#232F3E"/>
  <text x="1029" y="301" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>

  <rect x="1060" y="250" width="170" height="90" rx="10" fill="#EDF0F4" stroke="#232F3E" stroke-width="2.5"/>
  <text x="1145" y="285" font-size="18" font-weight="bold" fill="#232F3E" text-anchor="middle">Service</text>
  <text x="1145" y="310" font-size="15" fill="#444444" text-anchor="middle">EC2 / ECS</text>

  <line x1="890" y1="418" x2="890" y2="342" stroke="#0F7C8C" stroke-width="3" stroke-dasharray="9,6" marker-end="url(#arrT)"/>
  <circle cx="890" cy="380" r="15" fill="#0F7C8C"/>
  <text x="890" y="386" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>

  <rect x="750" y="420" width="280" height="100" rx="10" fill="#EBF6F7" stroke="#0F7C8C" stroke-width="2.5"/>
  <text x="890" y="450" font-size="17" font-weight="bold" fill="#0B5A66" text-anchor="middle">VPC Endpoint Service</text>
  <text x="890" y="474" font-size="15" fill="#444444" text-anchor="middle">Allowed Principals</text>
  <text x="890" y="496" font-size="15" fill="#444444" text-anchor="middle">40 Kundenaccounts</text>

  <rect x="50" y="430" width="230" height="95" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="165" y="462" font-size="20" font-weight="bold" fill="#1B3E86" text-anchor="middle">Kunde B</text>
  <text x="165" y="488" font-size="15" fill="#444444" text-anchor="middle">VPC 10.0.0.0/16</text>
  <text x="165" y="510" font-size="14" font-style="italic" fill="#9E1015" text-anchor="middle">gleiche CIDR wie SaaS</text>

  <line x1="280" y1="477" x2="368" y2="477" stroke="#2E6BE6" stroke-width="3" marker-end="url(#arrB)"/>
  <circle cx="324" cy="477" r="15" fill="#2E6BE6"/>
  <text x="324" y="483" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <rect x="370" y="435" width="215" height="85" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="477" y="463" font-size="17" font-weight="bold" fill="#2E6318" text-anchor="middle">Interface Endpoint</text>
  <text x="477" y="486" font-size="15" fill="#444444" text-anchor="middle">ENI, private IP</text>
  <text x="477" y="507" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">CIDR ist egal</text>

  <line x1="585" y1="477" x2="748" y2="320" stroke="#3F8624" stroke-width="3" marker-end="url(#arrGr)"/>

  <line x1="285" y1="575" x2="560" y2="575" stroke="#C7161D" stroke-width="3"/>
  <circle cx="422" cy="575" r="20" fill="#FFFFFF" stroke="#C7161D" stroke-width="3"/>
  <line x1="410" y1="563" x2="434" y2="587" stroke="#C7161D" stroke-width="4"/>
  <line x1="434" y1="563" x2="410" y2="587" stroke="#C7161D" stroke-width="4"/>
  <text x="422" y="612" font-size="15" fill="#9E1015" text-anchor="middle">Peering: CIDR kollidiert</text>

  <path d="M 585,522 L 585,660 L 1310,660 L 1310,688" stroke="#A16E00" stroke-width="3" fill="none" marker-end="url(#arrGd)"/>
  <circle cx="1000" cy="660" r="15" fill="#A16E00"/>
  <text x="1000" y="666" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>

  <text x="300" y="700" font-size="15" fill="#1B3E86" text-anchor="middle">und 38 weitere Kunden, je ein Endpoint</text>

  <rect x="1090" y="690" width="440" height="115" rx="10" fill="#FBF5E6" stroke="#A16E00" stroke-width="2.5"/>
  <text x="1310" y="720" font-size="19" font-weight="bold" fill="#7A5300" text-anchor="middle">Kosten trägt der Consumer</text>
  <text x="1310" y="746" font-size="15" fill="#444444" text-anchor="middle">$0,01 je Endpoint, AZ und Stunde</text>
  <text x="1310" y="768" font-size="15" fill="#444444" text-anchor="middle">3 AZs &#8776; $21,90 pro Monat und VPC</text>
  <text x="1310" y="790" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">+ $0,01/GB, erste 1 PB</text>

  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  PrivateLink ist einseitig — nur der Consumer initiiert  ·  überlappende CIDRs sind egal  ·  Allowed Principals statt IP-Allowlist</text>
</svg>
