  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 31 — VPC Peering vs Transit Gateway</text>
  <text x="60" y="106" font-size="21" fill="#555555">12 VPCs und ein Rechenzentrum: Full-Mesh-Peering scheitert an Betriebsaufwand und fehlendem Transit</text>

  <text x="60" y="155" font-size="19" font-weight="bold" fill="#9E1015">Full Mesh: 12 VPCs = 66 Verbindungen</text>
  <text x="830" y="155" font-size="19" font-weight="bold" fill="#232F3E">Transit Gateway: ein Hub statt 66 Verbindungen</text>

