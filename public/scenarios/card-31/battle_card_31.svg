  <text x="619" y="705" font-size="15" fill="#9E1015" text-anchor="middle">kein transitives Routing</text>

  <path d="M 190,710 L 190,780 L 1130,780 L 1130,444" stroke="#232F3E" stroke-width="3" fill="none" marker-end="url(#arrN)"/>
  <circle cx="950" cy="780" r="15" fill="#232F3E"/>
  <text x="950" y="786" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="620" y="762" font-size="16" fill="#232F3E" text-anchor="middle">ein VPN-Attachment statt vier Einzel-VPNs</text>

  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  Peering ist nicht transitiv — 12 VPCs = 66 Verbindungen  ·  nur TGW trägt on-premises zu allen VPCs  ·  TGW kostet pro Attachment und pro GB</text>
