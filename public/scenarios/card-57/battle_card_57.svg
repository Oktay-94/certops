<svg viewBox="0 0 1600 900" width="1600" height="900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <rect x="0" y="0" width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 57 — Glue ETL, Data Catalog, S3</text>
  <text x="60" y="106" font-size="21" fill="#555555">Naechtliche Transformation CSV nach Parquet — nur die neuen Dateien, ohne eigenen Cluster</text>

  <defs>
    <marker id="bGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B7F5A"/>
    </marker>
    <marker id="bPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7B5EA7"/>
    </marker>
    <marker id="bOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C2410C"/>
    </marker>
    <marker id="bBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F5C99"/>
    </marker>
  </defs>

  <path d="M 185,355 L 185,430" stroke="#1B7F5A" stroke-width="2.5" fill="none" marker-end="url(#bGreen)"/>
  <path d="M 310,470 L 395,470" stroke="#7B5EA7" stroke-width="2.5" fill="none" marker-end="url(#bPurple)"/>
  <path d="M 530,355 L 530,430" stroke="#7B5EA7" stroke-width="2.5" fill="none" marker-end="url(#bPurple)"/>
  <path d="M 875,355 L 875,410" stroke="#1F5C99" stroke-width="2.5" fill="none" marker-end="url(#bBlue)"/>
  <path d="M 665,505 L 750,505" stroke="#7B5EA7" stroke-width="2.5" fill="none" marker-end="url(#bPurple)"/>
  <path d="M 1000,505 L 1085,505" stroke="#C2410C" stroke-width="2.5" fill="none" marker-end="url(#bOrange)"/>
  <path d="M 1220,410 L 1220,355" stroke="#C2410C" stroke-width="2.5" fill="none" marker-end="url(#bOrange)"/>
  <path d="M 1355,272 L 1420,272" stroke="#1B7F5A" stroke-width="2.5" fill="none" marker-end="url(#bGreen)"/>

  <rect x="60" y="230" width="250" height="125" rx="10" fill="#F5F5F5" stroke="#555555" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="75" y="260" font-size="20" font-weight="bold" fill="#555555">Speditionspartner</text>
  <text x="75" y="288" font-size="15" fill="#444444">CSV, unkomprimiert</text>
  <text x="75" y="310" font-size="15" fill="#444444">uneinheitliche Typen</text>
  <text x="75" y="336" font-size="15" font-style="italic" fill="#666666">extern, ausserhalb AWS</text>

  <rect x="60" y="430" width="250" height="150" rx="10" fill="#EEF6F1" stroke="#1B7F5A" stroke-width="2.5"/>
  <text x="75" y="460" font-size="20" font-weight="bold" fill="#1B7F5A">S3 Raw-Zone</text>
  <text x="75" y="488" font-size="15" fill="#444444">s3://.../raw/</text>
  <text x="75" y="510" font-size="15" fill="#444444">CSV, 7 Jahre Bestand</text>
  <text x="75" y="532" font-size="15" fill="#444444">taeglich neue Dateien</text>
  <text x="75" y="558" font-size="15" font-style="italic" fill="#666666">Athena hier: teuer</text>

  <rect x="395" y="230" width="270" height="125" rx="10" fill="#F3EFF9" stroke="#7B5EA7" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="410" y="260" font-size="20" font-weight="bold" fill="#7B5EA7">Glue Crawler</text>
  <text x="410" y="288" font-size="15" fill="#444444">erkennt Schema</text>
  <text x="410" y="310" font-size="15" fill="#444444">findet Partitionen</text>
  <text x="410" y="336" font-size="15" font-style="italic" fill="#666666">laeuft nach Bedarf</text>

  <rect x="395" y="430" width="270" height="150" rx="10" fill="#F3EFF9" stroke="#7B5EA7" stroke-width="2.5"/>
  <text x="410" y="460" font-size="20" font-weight="bold" fill="#7B5EA7">Glue Data Catalog</text>
  <text x="410" y="488" font-size="15" fill="#444444">Tabellen + Partitionen</text>
  <text x="410" y="510" font-size="15" fill="#444444">Register, speichert nichts</text>
  <text x="410" y="532" font-size="15" fill="#444444">Quelle fuer den Job</text>
  <text x="410" y="558" font-size="15" font-style="italic" fill="#666666">nicht der ETL-Dienst</text>

  <rect x="750" y="230" width="250" height="125" rx="10" fill="#EAF1F8" stroke="#1F5C99" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="765" y="260" font-size="20" font-weight="bold" fill="#1F5C99">EventBridge</text>
  <text x="765" y="288" font-size="15" fill="#444444">Scheduler, 02:00 Uhr</text>
  <text x="765" y="310" font-size="15" fill="#444444">startet den Job</text>
  <text x="765" y="336" font-size="15" font-style="italic" fill="#666666">Batch, kein Stream</text>

  <rect x="750" y="410" width="250" height="195" rx="10" fill="#FDF0E9" stroke="#C2410C" stroke-width="2.5"/>
  <text x="765" y="440" font-size="20" font-weight="bold" fill="#C2410C">Glue ETL (Spark)</text>
  <text x="765" y="468" font-size="15" fill="#444444">serverlos, kein Cluster</text>
  <text x="765" y="490" font-size="15" fill="#444444">from_catalog(...)</text>
  <text x="765" y="512" font-size="15" fill="#444444">transformation_ctx gesetzt</text>
  <text x="765" y="534" font-size="15" fill="#444444">CSV nach Parquet</text>
  <text x="765" y="560" font-size="15" font-style="italic" fill="#666666">transformiert im Batch —</text>
  <text x="765" y="580" font-size="15" font-style="italic" fill="#666666">nicht im Fluss</text>

  <rect x="1085" y="410" width="270" height="195" rx="10" fill="#FDF0E9" stroke="#C2410C" stroke-width="2.5"/>
  <text x="1100" y="440" font-size="20" font-weight="bold" fill="#C2410C">Job Bookmark</text>
  <text x="1100" y="468" font-size="15" fill="#444444">Zustand des letzten Laufs</text>
  <text x="1100" y="490" font-size="15" fill="#444444">filtert auf neue Dateien</text>
  <text x="1100" y="512" font-size="15" fill="#444444">ab Glue 1.0 auch Parquet</text>
  <text x="1100" y="534" font-size="15" fill="#444444">braucht transformation_ctx</text>
  <text x="1100" y="560" font-size="15" font-style="italic" fill="#666666">ohne ihn: jede Nacht alles</text>
  <text x="1100" y="580" font-size="15" font-style="italic" fill="#666666">Pfadwechsel = Dateien weg</text>

  <rect x="1085" y="190" width="270" height="165" rx="10" fill="#EEF6F1" stroke="#1B7F5A" stroke-width="2.5"/>
  <text x="1100" y="220" font-size="20" font-weight="bold" fill="#1B7F5A">S3 Curated-Zone</text>
  <text x="1100" y="248" font-size="15" fill="#444444">s3://.../curated/</text>
  <text x="1100" y="270" font-size="15" fill="#444444">Parquet, spaltenweise</text>
  <text x="1100" y="292" font-size="15" fill="#444444">partitioniert nach Datum</text>
  <text x="1100" y="318" font-size="15" font-style="italic" fill="#666666">weniger gescanntes Volumen</text>

  <rect x="1420" y="190" width="120" height="165" rx="10" fill="#EEF6F1" stroke="#1B7F5A" stroke-width="2.5"/>
  <text x="1435" y="220" font-size="20" font-weight="bold" fill="#1B7F5A">Athena</text>
  <text x="1435" y="248" font-size="15" fill="#444444">Analysten</text>
  <text x="1435" y="270" font-size="15" fill="#444444">SQL ad hoc</text>
  <text x="1435" y="292" font-size="15" fill="#444444">schnell +</text>
  <text x="1435" y="314" font-size="15" fill="#444444">guenstig</text>

  <text x="200" y="400" font-size="15" font-style="italic" fill="#666666">abgelegt</text>
  <text x="322" y="452" font-size="15" font-style="italic" fill="#666666">liest</text>
  <text x="545" y="400" font-size="15" font-style="italic" fill="#666666">Schema</text>
  <text x="890" y="390" font-size="15" font-style="italic" fill="#666666">02:00</text>
  <text x="667" y="480" font-size="15" font-style="italic" fill="#666666">Tabelle</text>
  <text x="1008" y="480" font-size="15" font-style="italic" fill="#666666">fragt</text>
  <text x="1235" y="390" font-size="15" font-style="italic" fill="#666666">nur Delta</text>
  <text x="1362" y="250" font-size="15" font-style="italic" fill="#666666">liest</text>

  <circle cx="185" cy="392.5" r="15" fill="#1B7F5A"/>
  <text x="185" y="398.5" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="530" cy="392.5" r="15" fill="#7B5EA7"/>
  <text x="530" y="398.5" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="875" cy="382.5" r="15" fill="#1F5C99"/>
  <text x="875" y="388.5" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="707.5" cy="505" r="15" fill="#7B5EA7"/>
  <text x="707.5" y="511" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="1042.5" cy="505" r="15" fill="#C2410C"/>
  <text x="1042.5" y="511" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <circle cx="1220" cy="382.5" r="15" fill="#C2410C"/>
  <text x="1220" y="388.5" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
  <circle cx="1387.5" cy="272" r="15" fill="#1B7F5A"/>
  <text x="1387.5" y="278" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>

  <rect x="60" y="700" width="1480" height="130" rx="10" fill="#F7F7F7" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="80" y="740" font-size="16" font-weight="bold" fill="#111111">Naechtliche Transformation ist immer Glue ETL — der Data Catalog ist nur das Register davor.</text>
  <text x="80" y="772" font-size="15" fill="#444444">Job Bookmark wirkt nur mit transformation_ctx am Source-Node. Ohne ihn laeuft jede Nacht der volle Bestand.</text>
  <text x="80" y="800" font-size="15" fill="#444444">Input-Pfad bei aktivem Bookmark aendern, ohne den Kontext zu wechseln: Glue haelt die neuen Dateien fuer erledigt.</text>
</svg>
