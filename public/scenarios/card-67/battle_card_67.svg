  <circle cx="1355" cy="635" r="15" fill="#A16E00"/>
  <text x="1355" y="641" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>

  <line x1="290" y1="635" x2="452" y2="635" stroke="#C7161D" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrX)"/>
  <circle cx="350" cy="635" r="15" fill="#C7161D"/>
