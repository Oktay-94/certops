<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans">
  <defs>
    <marker id="arrQ" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2E6BE6"/>
    </marker>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#D97706"/>
    </marker>
    <marker id="arrS" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#3F8624"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#A16E00"/>
    </marker>
    <marker id="arrX" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#C7161D"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 67 — SageMaker Training &amp; Real-time Endpoints</text>
  <text x="60" y="106" font-size="21" fill="#555555">Eigenes Modell trainieren und als skalierbaren Endpoint betreiben — die Dimensionierung ist die eigentliche Arbeit</text>

  <!-- ===== Oberzeile: Trainingskette ===== -->

  <rect x="40" y="260" width="250" height="160" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="165" y="296" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">Trainingsdaten</text>
  <text x="165" y="322" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">S3</text>
  <text x="165" y="352" font-size="15" fill="#444444" text-anchor="middle">Schadensfälle</text>
  <text x="165" y="376" font-size="15" fill="#444444" text-anchor="middle">mit Bewertung</text>
  <text x="165" y="402" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Feature-Logik</text>

  <rect x="380" y="260" width="250" height="160" rx="10" fill="#FEF7EC" stroke="#D97706" stroke-width="2.5"/>
  <text x="505" y="298" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">Training Job</text>
  <text x="505" y="330" font-size="15" fill="#444444" text-anchor="middle">eigener Container</text>
  <text x="505" y="354" font-size="15" fill="#444444" text-anchor="middle">PyTorch-Code</text>
  <text x="505" y="382" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Instanz nur für</text>
  <text x="505" y="404" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">die Laufzeit</text>

  <rect x="720" y="260" width="250" height="160" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
  <text x="845" y="298" font-size="22" font-weight="bold" fill="#2E6318" text-anchor="middle">Modellartefakte</text>
  <text x="845" y="330" font-size="15" fill="#444444" text-anchor="middle">model.tar.gz</text>
  <text x="845" y="354" font-size="15" fill="#444444" text-anchor="middle">in S3</text>
  <text x="845" y="382" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">bleibt liegen,</text>
  <text x="845" y="404" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">kostet fast nichts</text>

  <rect x="1060" y="260" width="250" height="160" rx="10" fill="#FBF5E6" stroke="#A16E00" stroke-width="2.5"/>
  <text x="1185" y="298" font-size="22" font-weight="bold" fill="#7A5300" text-anchor="middle">Endpoint Config</text>
  <text x="1185" y="330" font-size="15" fill="#444444" text-anchor="middle">Instanztyp +</text>
  <text x="1185" y="354" font-size="15" fill="#444444" text-anchor="middle">Initial Count</text>
  <text x="1185" y="382" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">hier fällt die</text>
  <text x="1185" y="404" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">Dimensionierung</text>

  <!-- ===== Unterzeile: Betriebskette ===== -->

  <rect x="1060" y="560" width="250" height="150" rx="10" fill="#FEF7EC" stroke="#D97706" stroke-width="2.5"/>
  <text x="1185" y="596" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">Real-time</text>
  <text x="1185" y="622" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">Endpoint</text>
  <text x="1185" y="652" font-size="15" fill="#444444" text-anchor="middle">Payload max. 6 MB</text>
  <text x="1185" y="676" font-size="15" fill="#444444" text-anchor="middle">Timeout 60 s</text>
  <text x="1185" y="698" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">läuft dauerhaft</text>

  <rect x="720" y="560" width="250" height="150" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="845" y="596" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">Schadens-</text>
  <text x="845" y="622" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">Anwendung</text>
  <text x="845" y="652" font-size="15" fill="#444444" text-anchor="middle">ruft per HTTPS auf</text>
  <text x="845" y="676" font-size="15" fill="#444444" text-anchor="middle">Lastspitzen</text>
  <text x="845" y="698" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">morgens</text>

  <rect x="1400" y="560" width="160" height="150" rx="10" fill="#FBF5E6" stroke="#A16E00" stroke-width="2.5"/>
  <text x="1480" y="596" font-size="22" font-weight="bold" fill="#7A5300" text-anchor="middle">Auto</text>
  <text x="1480" y="622" font-size="22" font-weight="bold" fill="#7A5300" text-anchor="middle">Scaling</text>
  <text x="1480" y="650" font-size="15" fill="#444444" text-anchor="middle">Target</text>
  <text x="1480" y="672" font-size="15" fill="#444444" text-anchor="middle">Tracking</text>
  <text x="1480" y="694" font-size="13" fill="#666666" text-anchor="middle">InvocationsPerInst.</text>

  <!-- ===== Verworfen: Canvas / AutoML ===== -->
  <rect x="40" y="560" width="250" height="150" rx="10" fill="#FEF7EC" stroke="#D97706" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="165" y="596" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">Canvas /</text>
  <text x="165" y="622" font-size="22" font-weight="bold" fill="#A85A05" text-anchor="middle">AutoML</text>
  <text x="165" y="652" font-size="15" fill="#444444" text-anchor="middle">kein eigener</text>
  <text x="165" y="676" font-size="15" fill="#444444" text-anchor="middle">Trainingscode</text>
  <text x="165" y="698" font-size="15" font-style="italic" fill="#666666" text-anchor="middle">→ Karte 66</text>

  <!-- ===== Randbox: Model Monitor (Governance, gestrichelt) ===== -->
  <rect x="620" y="744" width="670" height="56" rx="9" fill="#FBF5E6" stroke="#A16E00" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="642" y="778" font-size="17" fill="#7A5300"><tspan font-weight="bold">Model Monitor</tspan> — Drift-Überwachung, für Neukunden zu ab 30.07.2026</text>

