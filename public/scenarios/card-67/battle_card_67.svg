  <text x="1185" y="492" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>

  <line x1="1052" y1="635" x2="978" y2="635" stroke="#D97706" stroke-width="3" marker-end="url(#arrC)"/>
  <text x="1015" y="612" font-size="15" fill="#A85A05" text-anchor="middle">Antwort</text>
  <circle cx="1015" cy="635" r="15" fill="#D97706"/>
  <text x="1015" y="641" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>

  <line x1="1318" y1="635" x2="1392" y2="635" stroke="#A16E00" stroke-width="3" marker-end="url(#arrG)"/>
