  <circle cx="492" cy="635" r="20" fill="#FFFFFF" stroke="#C7161D" stroke-width="3"/>
  <line x1="478" y1="621" x2="506" y2="649" stroke="#C7161D" stroke-width="4"/>
  <line x1="506" y1="621" x2="478" y2="649" stroke="#C7161D" stroke-width="4"/>

  <text x="310" y="692" font-size="15" fill="#9E1015">kein AutoML —</text>
  <text x="310" y="712" font-size="15" fill="#9E1015">Team hat eigenen Code</text>

  <!-- ===== Footer ===== -->
  <rect x="40" y="830" width="1510" height="52" rx="9" fill="#F4F4F4"/>
  <text x="62" y="863" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  Training Job = Rechenzeit auf Abruf · Endpoint läuft dauerhaft · Auto Scaling über InvocationsPerInstance · Payload 6 MB, Timeout 60 s</text>
