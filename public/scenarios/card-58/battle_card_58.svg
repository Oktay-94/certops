  <text x="195" y="398.5" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="372.5" cy="285" r="15" fill="#9A6700"/>
  <text x="372.5" y="291" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="560" cy="392.5" r="15" fill="#9A6700"/>
  <text x="560" y="398.5" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="737.5" cy="285" r="15" fill="#C2410C"/>
  <text x="737.5" y="291" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <circle cx="737.5" cy="500" r="15" fill="#C2410C"/>
  <text x="737.5" y="506" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <circle cx="1062.5" cy="250" r="15" fill="#B03060"/>
  <text x="1062.5" y="256" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
  <circle cx="1062.5" cy="545" r="15" fill="#B03060"/>
  <text x="1062.5" y="551" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>

  <rect x="60" y="700" width="1480" height="130" rx="10" fill="#F7F7F7" stroke="#CCCCCC" stroke-width="1.5"/>
  <text x="80" y="740" font-size="16" font-weight="bold" fill="#111111">Feingranulare Rechte ueber alle Engines: Lake Formation filtert an der Quelle, nicht im Dashboard.</text>
  <text x="80" y="772" font-size="15" fill="#444444">Solange IAMAllowedPrincipals Super-Rechte haelt, entscheidet IAM allein — die LF-Regeln greifen nicht.</text>
  <text x="80" y="800" font-size="15" fill="#444444">Wer S3:GetObject behaelt, liest per Download an Lake Formation vorbei. Governed Tables sind seit 31.12.2024 weg.</text>
</svg>
