  <rect x="400" y="680" width="260" height="90" rx="10" fill="#F5F0FE" stroke="#7A3FE0" stroke-width="2.5"/>
  <text x="530" y="710" font-size="18" font-weight="bold" fill="#5B2BAF" text-anchor="middle">Route 53 Latency</text>
  <text x="530" y="735" font-size="15" fill="#444444" text-anchor="middle">nur DNS-Auflösung</text>
  <text x="530" y="757" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">Pakete via Internet</text>

  <path d="M 1060,192 L 1330,192 L 1330,618" stroke="#A16E00" stroke-width="3" fill="none" marker-end="url(#arrGd)"/>
  <circle cx="1200" cy="192" r="15" fill="#A16E00"/>
  <text x="1200" y="198" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>

  <rect x="1120" y="620" width="420" height="155" rx="10" fill="#FBF5E6" stroke="#A16E00" stroke-width="2.5"/>
  <text x="1330" y="655" font-size="19" font-weight="bold" fill="#7A5300" text-anchor="middle">Kosten Global Accelerator</text>
  <text x="1330" y="684" font-size="15" fill="#444444" text-anchor="middle">$18 im Monat fix</text>
  <text x="1330" y="707" font-size="15" fill="#444444" text-anchor="middle">+ DT-Premium $0,007–0,105/GB</text>
  <text x="1330" y="731" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">nur in der dominanten Richtung</text>
  <text x="1330" y="757" font-size="15" font-weight="bold" fill="#7A5300" text-anchor="middle">AWS-Beispiel: 10 TB &#8594; $128</text>

  <rect x="40" y="820" width="1510" height="56" rx="9" fill="#F4F4F4"/>
  <text x="62" y="855" font-size="17" fill="#333333"><tspan font-weight="bold">Merksätze:</tspan>  GA beschleunigt den Weg, CloudFront den Inhalt  ·  nur GA kann UDP  ·  statische IPs gibt es inzwischen bei beiden</text>
