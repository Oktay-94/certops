  <text x="935" y="548" font-size="15" fill="#444444" text-anchor="middle">40 TB Patches</text>
  <text x="935" y="570" font-size="14" font-style="italic" fill="#666666" text-anchor="middle">kaum Origin-Last</text>

  <line x1="530" y1="678" x2="530" y2="620" stroke="#C7161D" stroke-width="3"/>
  <circle cx="530" cy="649" r="20" fill="#FFFFFF" stroke="#C7161D" stroke-width="3"/>
  <line x1="518" y1="637" x2="542" y2="661" stroke="#C7161D" stroke-width="4"/>
