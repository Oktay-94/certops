  <line x1="542" y1="427" x2="518" y2="451" stroke="#C7161D" stroke-width="4"/>
  <text x="620" y="439" font-size="15" fill="#9E1015">kein UDP</text>

  <text x="300" y="600" font-size="15" fill="#B25400" text-anchor="middle">Patch-Downloads, HTTP</text>

  <line x1="260" y1="380" x2="398" y2="510" stroke="#ED7100" stroke-width="3" marker-end="url(#arrO)"/>
  <circle cx="329" cy="445" r="15" fill="#ED7100"/>
