  <text x="530" y="567" font-size="15" fill="#444444" text-anchor="middle">cached am Edge</text>

  <line x1="660" y1="535" x2="808" y2="535" stroke="#ED7100" stroke-width="3" marker-end="url(#arrO)"/>
  <circle cx="734" cy="535" r="15" fill="#ED7100"/>
  <text x="734" y="541" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>

  <rect x="810" y="490" width="250" height="90" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
