  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <text x="60" y="70" font-size="40" font-weight="bold" fill="#111111">Battle Card 35 — Global Accelerator vs CloudFront</text>
  <text x="60" y="106" font-size="21" fill="#555555">Anycast-IPs und Backbone-Routing statt Caching: was der Weg bringt und was der Inhalt</text>

  <text x="300" y="230" font-size="15" fill="#232F3E" text-anchor="middle">UDP-Spielverkehr</text>

  <rect x="50" y="280" width="210" height="140" rx="10" fill="#EFF4FE" stroke="#2E6BE6" stroke-width="2.5"/>
  <text x="155" y="320" font-size="22" font-weight="bold" fill="#1B3E86" text-anchor="middle">Spieler</text>
  <text x="155" y="348" font-size="15" fill="#444444" text-anchor="middle">weltweit, mobil</text>
  <text x="155" y="374" font-size="15" fill="#444444" text-anchor="middle">UDP + HTTP</text>
  <text x="155" y="400" font-size="14" font-style="italic" fill="#9E1015" text-anchor="middle">Asien: 180 ms</text>

