  <line x1="660" y1="255" x2="808" y2="307" stroke="#232F3E" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arrN)"/>
  <circle cx="734" cy="281" r="15" fill="#232F3E"/>
  <text x="734" y="287" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="710" y="340" font-size="15" fill="#232F3E" text-anchor="middle">Failover in Sekunden</text>

  <rect x="810" y="265" width="250" height="85" rx="10" fill="#F1F8EC" stroke="#3F8624" stroke-width="2.5"/>
