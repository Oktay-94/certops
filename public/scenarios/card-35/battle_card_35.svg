  <text x="530" y="242" font-size="15" fill="#444444" text-anchor="middle">2 statische Anycast-IPs</text>
  <text x="530" y="266" font-size="15" fill="#444444" text-anchor="middle">Layer 4, TCP und UDP</text>

  <line x1="660" y1="216" x2="808" y2="192" stroke="#232F3E" stroke-width="3" marker-end="url(#arrN)"/>
  <circle cx="734" cy="204" r="15" fill="#232F3E"/>
